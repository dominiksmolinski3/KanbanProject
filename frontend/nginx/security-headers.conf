# What the browser is told this application may do, sent by the edge.
#
# These are the same claims SecurityHeaders.java makes, and they are here because nginx now serves
# index.html: a header Spring writes reaches nobody on the document response, and the document is
# the response that matters for a CSP. Spring keeps writing them on API and attachment responses,
# which still need them - so the policy is one rule living in two files, and
# SecurityHeadersMatchTheEdgeTest reads both and fails the build when they disagree. That is the
# same trade DeadLetterAlertTest makes against the Terraform.
#
# Included rather than written once in the server block, because nginx's add_header does not
# inherit into a location that has an add_header of its own - and the two locations below both add
# a Cache-Control. A missing include is therefore a page served with no policy at all, which is why
# the test asserts every location that adds a header includes this file.
#
# `always` on each, so the headers survive an error response as well as a 200.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-src https://www.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Written unconditionally for the reason SecurityConfiguration overrides Spring's matcher: TLS
# terminates at the Container Apps ingress and the container is handed plain HTTP, so a writer
# gated on "is this request secure" fires on nothing. A user agent must ignore an HSTS header
# received over plain HTTP, and the ingress redirects, so there is no case where sending it is
# wrong. preload stays off: it is a one-way door on a domain this deployment does not own.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Cross-Origin-Embedder-Policy is deliberately absent here as well as in SecurityHeaders, and both
# sides assert the absence so that adding it is a deliberate act: require-corp breaks the reCAPTCHA
# frame, which carries no CORP header of its own, and buys cross-origin isolation this application
# has no use for.
