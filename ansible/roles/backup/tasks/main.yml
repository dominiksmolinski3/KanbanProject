---
- name: Install the backup script
  ansible.builtin.template:
    src: prometheus-backup.sh.j2
    dest: /usr/local/sbin/prometheus-backup
    owner: root
    group: root
    mode: "0750"

- name: Install the backup service and timer
  ansible.builtin.template:
    src: "prometheus-backup.{{ item }}.j2"
    dest: "/etc/systemd/system/prometheus-backup.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [service, timer]
  register: backup_units

- name: Schedule the backup when there is somewhere to send it
  ansible.builtin.systemd_service:
    name: prometheus-backup.timer
    state: "{{ (backup_container_url | length > 0) | ternary('started', 'stopped') }}"
    enabled: "{{ backup_container_url | length > 0 }}"
    daemon_reload: "{{ backup_units is changed }}"
