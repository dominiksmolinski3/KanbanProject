---
- name: Restart prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    state: restarted
    daemon_reload: true

- name: Reload prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    state: reloaded

- name: Restart node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    state: restarted
    daemon_reload: true

- name: Restart blackbox_exporter
  ansible.builtin.systemd_service:
    name: blackbox_exporter
    state: restarted
    daemon_reload: true
