services:
  # The public edge: nginx serving the built bundle and reverse-proxying what the API owns. It is
  # the only service that publishes a port a browser uses, which is what makes this stack the same
  # shape as the deployment - and the only realistic place to catch an nginx misconfiguration
  # before it reaches Azure.
  web:
    build:
      context: ./frontend
      args:
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY}
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      app:
        condition: service_healthy
    environment:
      # No URI part, for the reason the template's comment gives: a trailing slash here would make
      # nginx rewrite the path and every /api route would 404.
      API_UPSTREAM: http://app:8080
    deploy:
      resources:
        limits:
          memory: 128M

  app:
    build:
      context: ./backend
    restart: unless-stopped
    # Published for poking the API directly - `curl :8081/actuator/health` - which is the one thing
    # the edge deliberately does not proxy. A browser uses :8080 and goes through nginx.
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${SPRING_DATASOURCE_DB}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ACS_EMAIL_CONNECTION_STRING: ${ACS_EMAIL_CONNECTION_STRING}
      ACS_EMAIL_SENDER_ADDRESS: ${ACS_EMAIL_SENDER_ADDRESS}
      # The delivery-report webhook's shared key. Blank locally, and blank means the route answers
      # 404 - Azure cannot reach a container on your laptop anyway, so there is nothing here for it
      # to be open for.
      APP_MAIL_DELIVERY_REPORT_KEY: ${APP_MAIL_DELIVERY_REPORT_KEY:-}
      CAPTCHA_SECRET: ${CAPTCHA_SECRET}
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED}
      # One proxy in front of the app now, so ClientIpResolver has to skip exactly one hop of
      # X-Forwarded-For. Left at the default of 0 it reads getRemoteAddr(), which since the split
      # is nginx's container address for every request in the stack - one shared escalation bucket
      # for everybody, which is the same failure the deployment has at 1 instead of 2 and is worth
      # having wrong in neither place. The deployment sets 2: the ingress, then nginx.
      SECURITY_RATE_LIMIT_TRUSTED_PROXY_COUNT: 1
      # The escalation lives in the redis service below rather than in process memory, so it means
      # what its numbers say even once this stack runs more than one `app` replica.
      SECURITY_RATE_LIMIT_REDIS_HOST: redis
      # The STOMP broker relay's own connection - see WebSocketConfig.configureMessageBroker. Every
      # `app` replica relays to the rabbitmq service below rather than holding a broker in its own
      # JVM, so a board event published on one replica still reaches a subscriber connected to
      # another. Not the stock guest/guest account: RabbitMQ refuses it from anywhere but localhost,
      # and this connects from a different container - the same reason redis, unlike guest, needs no
      # override at all (it never restricts by origin).
      STOMP_RELAY_HOST: rabbitmq
      STOMP_RELAY_USERNAME: kanban
      STOMP_RELAY_PASSWORD: kanban
      # Attachments go to the azurite service below rather than to Azure. The key in that default
      # is Azurite's published development account - documented, identical on every machine that has
      # ever run the emulator, and worth nothing. Point AZURE_STORAGE_CONNECTION_STRING somewhere
      # else, or set it empty, to change or switch off local attachment storage.
      AZURE_STORAGE_CONNECTION_STRING: '${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}'
    deploy:
      resources:
        limits:
          memory: 512M

  # The Blob Storage emulator, so `docker-compose up` gives you attachments as well as a board.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    restart: unless-stopped
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data
    volumes:
      - azurite_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SPRING_DATASOURCE_DB}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # No init script. Flyway creates the schema and seeds the default columns on first start,
      # so local development gets the same schema by the same route as every other environment -
      # and an init script here would leave the volume non-empty, which is exactly the state
      # baseline-on-migrate reads as "already migrated".
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G

  # Backs AuthRateLimiter's escalation - see security.rate-limit.redis-host. No password and no TLS
  # locally, the same trust boundary the postgres and azurite services already have: everything on
  # this network is this stack.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M

  # The STOMP broker WebSocketConfig relays to - see stomp.relay.host. The stock image has the STOMP
  # plugin off by default, so the command enables it and then hands off to the image's own entrypoint,
  # which is what sets up RABBITMQ_DEFAULT_USER/PASS before starting the broker. No TLS locally, the
  # same trust boundary redis and postgres already have on this network.
  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    command: sh -c "rabbitmq-plugins enable --offline rabbitmq_stomp && exec docker-entrypoint.sh rabbitmq-server"
    environment:
      RABBITMQ_DEFAULT_USER: kanban
      RABBITMQ_DEFAULT_PASS: kanban
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  azurite_data:
