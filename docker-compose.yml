x-api: &api
  build:
    context: ./backend
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    azurite:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    appinsights-sink:
      condition: service_healthy
  environment:
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${SPRING_DATASOURCE_DB}
    SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
    SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    LOG_FORMAT: ecs
    DB_MAX_POOL_SIZE: 6
    JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    ACS_EMAIL_CONNECTION_STRING: ${ACS_EMAIL_CONNECTION_STRING}
    ACS_EMAIL_SENDER_ADDRESS: ${ACS_EMAIL_SENDER_ADDRESS}
    APP_MAIL_DELIVERY_REPORT_KEY: ${APP_MAIL_DELIVERY_REPORT_KEY:-}
    CAPTCHA_SECRET: ${CAPTCHA_SECRET}
    CAPTCHA_ENABLED: ${CAPTCHA_ENABLED}
    SECURITY_RATE_LIMIT_TRUSTED_PROXY_COUNT: 1
    SECURITY_RATE_LIMIT_REDIS_HOST: redis
    STOMP_RELAY_HOST: rabbitmq
    STOMP_RELAY_USERNAME: kanban
    STOMP_RELAY_PASSWORD: kanban
    AZURE_STORAGE_CONNECTION_STRING: '${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}'
    APPLICATIONINSIGHTS_CONNECTION_STRING: 'InstrumentationKey=00000000-0000-0000-0000-000000000000;IngestionEndpoint=http://appinsights-sink:8080/;LiveEndpoint=http://appinsights-sink:8080/'
    APPLICATIONINSIGHTS_METRIC_INTERVAL_SECONDS: 10
    OTLP_METRICS_ENABLED: ${OTLP_METRICS_ENABLED:-false}
    OTLP_METRICS_URL: http://prometheus:9090/api/v1/otlp/v1/metrics
    OTLP_METRICS_STEP: 10s
  deploy:
    resources:
      limits:
        memory: 1G

services:
  web:
    build:
      context: ./frontend
      args:
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY}
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      app:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://app:8080
    deploy:
      resources:
        limits:
          memory: 128M

  app:
    <<: *api
    ports:
      - "127.0.0.1:8081:8080"

  app2:
    <<: *api
    profiles: ["replicas"]
    ports:
      - "127.0.0.1:8082:8080"

  # image scan and hadolint to cover. Published on loopback only, for `curl :8099/summary` and for
  appinsights-sink:
    image: node:26-alpine@sha256:0b36e8c136b94cd4fcf02188228e76c31ad5872eef3fec8cbd2eee500cfd9e80
    restart: unless-stopped
    command: node /sink/server.mjs
    volumes:
      - ./observability/appinsights-sink:/sink:ro
    ports:
      - "127.0.0.1:8099:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 64M

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    restart: unless-stopped
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data
    volumes:
      - azurite_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M

  postgres:
    image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SPRING_DATASOURCE_DB}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M

  rabbitmq:
    image: rabbitmq:4-alpine@sha256:2cb43283d8bbd3caa6c0f0dc00e96c8de772df33df7fd8af6aee4d605aeb8ada
    restart: unless-stopped
    command: sh -c "rabbitmq-plugins enable --offline rabbitmq_stomp rabbitmq_prometheus && exec docker-entrypoint.sh rabbitmq-server"
    environment:
      RABBITMQ_DEFAULT_USER: kanban
      RABBITMQ_DEFAULT_PASS: kanban
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/scrape/local.yml:/etc/prometheus/scrape/local.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    image: grafana/grafana-oss:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/kanban.yml:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    # tmpfs, not a volume: its first-run SQLite migrations crawl on a volume, and all of its state is provisioned
    tmpfs:
      - /var/lib/grafana:uid=472,gid=0
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 256M

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: postgres:5432/${SPRING_DATASOURCE_DB}?sslmode=disable
      DATA_SOURCE_USER: ${SPRING_DATASOURCE_USERNAME}
      DATA_SOURCE_PASS: ${SPRING_DATASOURCE_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 64M

  redis-exporter:
    image: oliver006/redis_exporter:v1.93.0@sha256:6ca518a72f30f7f576ef92963de1b91d3c3f5fd3aeac949f878bfda183587820
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis://redis:6379
    deploy:
      resources:
        limits:
          memory: 64M

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.0@sha256:9613f2884689b6fad9f1939f6a3b0388c93a022cfaededb19545b329b5c83dea
    profiles: ["monitoring"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M

  k6:
    image: grafana/k6:2.3.0@sha256:9c2dee7f8ed74d317e4027c06a10f169b625638189de8d4555d0b3486a5aeb34
    profiles: ["loadtest"]
    command: ["run", "--out", "experimental-prometheus-rw", "/loadtest/kanban.js"]
    volumes:
      - ./loadtest:/loadtest:ro
    environment:
      LOAD_BASE_URL: http://web:8080/api
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(50),p(95),p(99),max
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:
  azurite_data:
  prometheus_data:
