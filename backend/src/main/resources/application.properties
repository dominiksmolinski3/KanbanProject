spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL}
server.port=8080
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.web.resources.static-locations=classpath:/static/
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Flyway owns the schema; Hibernate is only allowed to check that the entities agree with it.
# `validate` fails fast at startup on a mismatch, which is the point: under the previous `update`
# the schema was whatever the running jar happened to declare, applied silently, and a column could
# never be dropped, renamed or backfilled.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# An environment whose schema Hibernate already created is marked at V1 rather than having V1 run
# against it; migrations above the baseline then apply normally. A fresh database is empty, so it
# runs V1 like any other migration.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema as created by ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.mvc.contentnegotiation.favor-parameter=false
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# Logging for troubleshooting
logging.level.org.springframework.boot.actuate=INFO
logging.level.org.springframework.web=INFO
# Email Config
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.keep-alive-interval-ms=${MAIL_KEEP_ALIVE_INTERVAL_MS:240000}
security.captcha.enabled=${CAPTCHA_ENABLED:false}
security.captcha.secret=${CAPTCHA_SECRET:}
#JWT
security.jwt.secret-key=${JWT_SECRET_KEY}
# Fifteen minutes, down from an hour. An access token is a signed claim and cannot be withdrawn, so
# its lifetime is the only bound on a stolen one - and until refresh tokens existed, shortening it
# would have meant signing people out every fifteen minutes for no gain. Now the session outlives
# the access token, so the number can be the security one rather than the convenience one.
security.jwt.expiration-time=${JWT_EXPIRATION_TIME:900000}
# Thirty days. This one is a row, so it is bounded by revocation rather than by its expiry: logging
# out, changing a password, or presenting an already-rotated token all end it early.
security.jwt.refresh-expiration-time=${JWT_REFRESH_EXPIRATION_TIME:2592000000}
# CORS / SockJS origins
# One list, read by both SecurityConfiguration and WebSocketConfig. The default in
# AllowedOriginsProperties covers the production domain and local development; override it here or
# through SECURITY_CORS_ALLOWED_ORIGINS when a deployment answers on a different host.
#security.cors.allowed-origins=https://kanbanproject.pl,http://localhost:5173
