spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL}
server.port=8080
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.web.resources.static-locations=classpath:/static/
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Flyway owns the schema; Hibernate is only allowed to check that the entities agree with it.
# `validate` fails fast at startup on a mismatch, which is the point: under the previous `update`
# the schema was whatever the running jar happened to declare, applied silently, and a column could
# never be dropped, renamed or backfilled.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# An environment whose schema Hibernate already created is marked at V1 rather than having V1 run
# against it; migrations above the baseline then apply normally. A fresh database is empty, so it
# runs V1 like any other migration.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema as created by ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.mvc.contentnegotiation.favor-parameter=false
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# Logging for troubleshooting
logging.level.org.springframework.boot.actuate=INFO
logging.level.org.springframework.web=INFO
# Email Config - Azure Communication Services Email, over HTTPS rather than SMTP.
# Both of the first two are empty by default and an empty one turns mail off: the app starts and
# drops messages instead of refusing to boot, which is what lets CI and a fresh clone run without
# an Azure account. A deployment that means to send mail must set both.
app.mail.connection-string=${ACS_EMAIL_CONNECTION_STRING:}
# Must be an address the linked domain actually has - `DoNotReply@<guid>.azurecomm.net` on an
# Azure managed domain, or a sender username created under a custom one.
app.mail.sender-address=${ACS_EMAIL_SENDER_ADDRESS:}
# Per-attempt HTTP timeout, and retries on top of the first attempt for transient failures.
# One retry, because these sends are still on the request thread and each one is time a signup
# spends waiting. Raise it when sending moves behind a queue, not before.
app.mail.request-timeout=${ACS_EMAIL_REQUEST_TIMEOUT:10s}
app.mail.max-retries=${ACS_EMAIL_MAX_RETRIES:1}
# Attachments - Azure Blob Storage, not the database. Set exactly one way in: the endpoint for a
# real account, which is closed to the internet, reached over a private endpoint with a managed
# identity, and has no key at all; or a connection string for a local Azurite container, whose key
# is a published constant. Neither set turns attachments off - the app starts and refuses uploads
# with a 503, the same allowance app.mail.* makes, so CI and a fresh clone need no Azure account.
app.storage.endpoint=${AZURE_STORAGE_BLOB_ENDPOINT:}
app.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
app.storage.container=${AZURE_STORAGE_CONTAINER:task-attachments}
# The user-assigned identity to authenticate as. Empty falls back to DefaultAzureCredential, which
# is what picks up an `az login` when a developer points this at a real account.
app.storage.identity-client-id=${AZURE_STORAGE_IDENTITY_CLIENT_ID:}
security.captcha.enabled=${CAPTCHA_ENABLED:false}
security.captcha.secret=${CAPTCHA_SECRET:}
#JWT
security.jwt.secret-key=${JWT_SECRET_KEY}
# Fifteen minutes, down from an hour. An access token is a signed claim and cannot be withdrawn, so
# its lifetime is the only bound on a stolen one - and until refresh tokens existed, shortening it
# would have meant signing people out every fifteen minutes for no gain. Now the session outlives
# the access token, so the number can be the security one rather than the convenience one.
security.jwt.expiration-time=${JWT_EXPIRATION_TIME:900000}
# Thirty days. This one is a row, so it is bounded by revocation rather than by its expiry: logging
# out, changing a password, or presenting an already-rotated token all end it early. It is also a
# sliding window - every rotation issues a replacement thirty days out - so an account in regular
# use is never signed out by it.
security.jwt.refresh-expiration-time=${JWT_REFRESH_EXPIRATION_TIME:2592000000}
# Ninety days, and the one bound the sliding window above cannot slide past. The chain's deadline is
# stamped at the login that starts it and carried forward unchanged through every rotation; the
# effective expiry is the earlier of it and the rolling thirty days. It exists for the token
# revocation cannot catch - one a thief keeps rotating ahead of the real client, so the reuse check
# never fires - which otherwise lasts forever. Must be at least the sliding window, or that window
# would never apply.
security.jwt.refresh-absolute-expiration-time=${JWT_REFRESH_ABSOLUTE_EXPIRATION_TIME:7776000000}
# CORS / SockJS origins
# One list, read by both SecurityConfiguration and WebSocketConfig. The default in
# AllowedOriginsProperties covers the production domain and local development; override it here or
# through SECURITY_CORS_ALLOWED_ORIGINS when a deployment answers on a different host.
#security.cors.allowed-origins=https://kanbanproject.pl,http://localhost:5173
