spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL}
server.port=8080
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
# Unset, this tracks maximum-pool-size and every idle replica holds its whole share of the fleet budget.
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.web.resources.add-mappings=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema as created by ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.mvc.contentnegotiation.favor-parameter=false
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.writer-with-order-by-keys=true
springdoc.show-actuator=false
logging.structured.format.console=${LOG_FORMAT:}
logging.level.org.springframework.boot.actuate=INFO
logging.level.org.springframework.web=INFO
app.mail.connection-string=${ACS_EMAIL_CONNECTION_STRING:}
app.mail.sender-address=${ACS_EMAIL_SENDER_ADDRESS:}
app.mail.request-timeout=${ACS_EMAIL_REQUEST_TIMEOUT:10s}
app.mail.max-retries=${ACS_EMAIL_MAX_RETRIES:1}
app.mail.delivery-report-key=${APP_MAIL_DELIVERY_REPORT_KEY:}
app.storage.endpoint=${AZURE_STORAGE_BLOB_ENDPOINT:}
app.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
app.storage.container=${AZURE_STORAGE_CONTAINER:task-attachments}
app.storage.identity-client-id=${AZURE_STORAGE_IDENTITY_CLIENT_ID:}
app.storage.max-concurrent-transfers=${ATTACHMENT_MAX_CONCURRENT_TRANSFERS:8}
app.storage.replica-count-hint=${ATTACHMENT_REPLICA_COUNT_HINT:1}
app.storage.max-attachments-per-board=${ATTACHMENT_MAX_PER_BOARD:500}
app.storage.max-total-bytes-per-board=${ATTACHMENT_MAX_TOTAL_BYTES_PER_BOARD:1073741824}
security.captcha.enabled=${CAPTCHA_ENABLED:false}
security.captcha.secret=${CAPTCHA_SECRET:}
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=${JWT_EXPIRATION_TIME:900000}
security.jwt.refresh-expiration-time=${JWT_REFRESH_EXPIRATION_TIME:2592000000}
security.jwt.refresh-absolute-expiration-time=${JWT_REFRESH_ABSOLUTE_EXPIRATION_TIME:7776000000}

app.chat.retention-days=90
