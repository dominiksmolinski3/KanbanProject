# The English messages, and the fallback for any locale with no bundle of its own.
#
# There is no messages_en.properties: this file is it. ResourceBundle looks for the language-
# suffixed file first and lands here when there is none, so a tenth language added without a
# translation mails English rather than mailing nothing.
#
# Apostrophes: Spring runs a message through MessageFormat only when it is given arguments, so a
# lone ' is safe in a key with no {0} and must be doubled in one that has them. That asymmetry is a
# trap, so MailTemplatesTest renders every key in every locale with sample arguments and fails on a
# surviving brace - which is what a stray apostrophe produces.

mail.dir=ltr

mail.verification.subject=Account Verification
mail.verification.heading=Welcome to our app!
mail.verification.intro=Please enter the verification code below to continue. It expires in {0} minutes.
mail.verification.codeLabel=Verification Code:
mail.verification.codeText=Verification code: {0}

mail.reset.subject=Password Reset
mail.reset.heading=Reset your password
mail.reset.intro=Enter the code below to choose a new password. It expires in {0} minutes.
mail.reset.codeLabel=Reset Code:
mail.reset.codeText=Reset code: {0}
mail.reset.footnote=If you did not ask for this, nothing has changed on your account and you can ignore this message.

mail.overdue.subject=Task overdue: {0}
mail.overdue.heading=A task has passed its deadline
mail.overdue.intro={0} on {1} has passed its deadline of {2}.
mail.overdue.introNoDeadline={0} on {1} has passed its deadline.
mail.overdue.footnote=Open the board to reschedule it or move it on.
mail.overdue.untitled=Untitled task
mail.overdue.defaultBoard=your board
