<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1080" height="560" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#455a64"/>
    </marker>
  </defs>

  <text x="540" y="24" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a1a">Application architecture — request &amp; data flow</text>

  <!-- Browser -->
  <rect x="20" y="40" width="190" height="70" rx="10" fill="#f5f5f5" stroke="#616161" stroke-width="1.5"/>
  <text x="115" y="68" text-anchor="middle" font-size="14" font-weight="600" fill="#333333">Browser</text>
  <text x="115" y="87" text-anchor="middle" font-size="12" fill="#555555">React SPA (Vite bundle)</text>

  <!-- nginx web -->
  <rect x="260" y="40" width="230" height="70" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="375" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#0d3d6b">nginx — kanban-web</text>
  <text x="375" y="80" text-anchor="middle" font-size="12" fill="#0d3d6b">external ingress · reverse proxy</text>
  <text x="375" y="96" text-anchor="middle" font-size="11" fill="#0d3d6b">/api · /ws · /v3/api-docs — up to 5 replicas</text>

  <!-- API -->
  <rect x="540" y="40" width="250" height="70" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="665" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#0d3d6b">Spring Boot API — kanban-api</text>
  <text x="665" y="80" text-anchor="middle" font-size="12" fill="#0d3d6b">internal ingress · REST + STOMP</text>
  <text x="665" y="96" text-anchor="middle" font-size="11" fill="#0d3d6b">up to 5 replicas</text>

  <!-- arrows row 1 -->
  <line x1="210" y1="75" x2="256" y2="75" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="233" y="66" text-anchor="middle" font-size="11" fill="#455a64">HTTPS :443</text>

  <line x1="490" y1="75" x2="536" y2="75" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="513" y="66" text-anchor="middle" font-size="11" fill="#455a64">proxy_pass</text>
  <text x="665" y="130" text-anchor="middle" font-size="10.5" fill="#455a64">TLS + SNI verified</text>

  <!-- fan-out arrows to row 2 -->
  <line x1="665" y1="110" x2="116" y2="296" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="665" y1="110" x2="328" y2="296" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="665" y1="110" x2="540" y2="296" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="665" y1="110" x2="752" y2="296" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="665" y1="110" x2="964" y2="296" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- row 2 boxes -->
  <rect x="20" y="300" width="192" height="80" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="116" y="328" text-anchor="middle" font-size="13" font-weight="600" fill="#1b4620">PostgreSQL</text>
  <text x="116" y="344" text-anchor="middle" font-size="12" fill="#1b4620">Flexible Server</text>
  <text x="116" y="362" text-anchor="middle" font-size="10.5" fill="#1b4620">sslmode=verify-full</text>

  <rect x="232" y="300" width="192" height="80" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="328" y="328" text-anchor="middle" font-size="13" font-weight="600" fill="#1b4620">Azure Managed Redis</text>
  <text x="328" y="346" text-anchor="middle" font-size="11" fill="#1b4620">auth rate-limit</text>
  <text x="328" y="362" text-anchor="middle" font-size="11" fill="#1b4620">escalation store</text>

  <rect x="444" y="300" width="192" height="80" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="540" y="328" text-anchor="middle" font-size="13" font-weight="600" fill="#1b4620">RabbitMQ broker</text>
  <text x="540" y="346" text-anchor="middle" font-size="11" fill="#1b4620">STOMP relay</text>
  <text x="540" y="362" text-anchor="middle" font-size="11" fill="#1b4620">board + chat events</text>

  <rect x="656" y="300" width="192" height="80" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="752" y="328" text-anchor="middle" font-size="13" font-weight="600" fill="#1b4620">Blob Storage</text>
  <text x="752" y="346" text-anchor="middle" font-size="11" fill="#1b4620">task attachments</text>
  <text x="752" y="362" text-anchor="middle" font-size="11" fill="#1b4620">streamed, not buffered</text>

  <rect x="868" y="300" width="192" height="80" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="964" y="328" text-anchor="middle" font-size="13" font-weight="600" fill="#1b4620">ACS Email API</text>
  <text x="964" y="346" text-anchor="middle" font-size="11" fill="#1b4620">verification / reset /</text>
  <text x="964" y="362" text-anchor="middle" font-size="11" fill="#1b4620">overdue mail</text>

  <!-- callout box -->
  <rect x="300" y="420" width="480" height="66" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.2"/>
  <text x="540" y="442" text-anchor="middle" font-size="11.5" fill="#5d4200">Every API replica connects to the same broker — a board or chat</text>
  <text x="540" y="458" text-anchor="middle" font-size="11.5" fill="#5d4200">event published by one reaches subscribers connected to any other.</text>
  <text x="540" y="474" text-anchor="middle" font-size="11.5" fill="#5d4200">(cypress/replicas/cross-replica-sync.cy.js proves this in CI.)</text>

  <!-- footer -->
  <text x="540" y="520" text-anchor="middle" font-size="12" fill="#555555">Postgres, Redis, RabbitMQ and Blob Storage are shared, out-of-process state —</text>
  <text x="540" y="538" text-anchor="middle" font-size="12" fill="#555555">what makes it safe to run more than one API replica (api_max_replicas &gt; 1).</text>
</svg>
