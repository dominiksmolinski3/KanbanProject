version: 2

registries:
  dhi:
    type: docker-registry
    url: dhi.io
    username: ${{secrets.DOCKERHUB_USERNAME}}
    password: ${{secrets.DOCKERHUB_TOKEN}}

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ops
      include: scope
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
      - /observability/grafana
    registries:
      - dhi
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      docker-compose:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    ignore:
      # @typescript-eslint does not accept TypeScript 7 yet; npm ci fails on the peer range.
      - dependency-name: typescript
        versions: [ ">= 7" ]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
      capacitor:
        patterns:
          - "@capacitor/*"
      minor-and-patch:
        update-types: [minor, patch]
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: /frontend/android
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      gradle:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: terraform
    directories:
      - /terraform
      - /terraform/bootstrap
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ops
      include: scope

  - package-ecosystem: pip
    directories:
      - /.checkov
      - /ansible
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      ci-tools:
        patterns:
          - "*"
    ignore:
      # The monitoring VM runs Ubuntu's packaged Ansible; Molecule has to test that one.
      - dependency-name: ansible
