name: Sweep alarm

# The one thing every unattended workflow in this repository shares: nobody is looking at it
# when it runs. A pull request has an author watching the checks; a sweep on a cron has
# nobody, and a red run nobody opens is the same as no run at all.
#
# `kanban-ci.yml` learned this first - its `trunk-alarm` job, which opened and closed a real
# issue during rev 24's drill. This is that job, lifted out so the other sweeps can have it
# too, because the alternative is four copies of the same shell script drifting apart. The
# caller passes the results it collected and a phrase for the title; everything else comes
# from the `github` context, which inside a reusable workflow is the *caller's*.
on:
  workflow_call:
    inputs:
      results:
        description: 'Space-separated needs.*.result values, one per job the caller waits on'
        required: true
        type: string
      subject:
        description: 'What failed, as it reads after the colon in the issue title'
        required: true
        type: string
      label:
        description: 'Label to open the issue under; also how the issue is found again'
        required: false
        default: sweep-red
        type: string

permissions:
  contents: read

jobs:
  alarm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
    - name: Open, update or close the issue for this sweep
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        RESULTS: ${{ inputs.results }}
        SUBJECT: ${{ inputs.subject }}
        LABEL: ${{ inputs.label }}
        WORKFLOW: ${{ github.workflow }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        REF_NAME: ${{ github.ref_name }}
        TRIGGER: ${{ github.event_name }}
        CONTACT: ${{ vars.SECURITY_CONTACT || github.repository_owner }}
      run: |
        set -euo pipefail

        # Anything that is not a pass is red. `skipped` is included deliberately: a job that did
        # not run is a job that proved nothing, and reading that as green is how this whole gap
        # came about in the first place.
        red=false
        for result in $RESULTS; do
          if [ "$result" != "success" ]; then red=true; fi
        done

        # One issue per ref per sweep. Per ref, because a dispatch can sweep a branch and a green
        # branch sweep must not close the issue saying main is broken. Per sweep, because a red
        # DAST run and a red image scan are two different things to go and fix.
        title="$REF_NAME is red: $SUBJECT"

        # --force makes this idempotent; `gh issue create --label` fails outright on a label that
        # does not exist yet, which would make the very first alarm the one that gets lost.
        gh label create "$LABEL" --color B60205 \
          --description "A scheduled sweep found something broken" --force >/dev/null

        # Matched on the title rather than taking the first labelled issue: see above. jq rather
        # than `gh --jq` only so the title can be passed in as an argument instead of interpolated
        # into a filter, where a ref containing a quote would break the expression.
        existing=$(gh issue list --label "$LABEL" --state open --limit 100 --json number,title \
          | jq -r --arg title "$title" 'map(select(.title == $title)) | .[0].number // empty')

        if [ "$red" = true ]; then
          body=$(printf 'The `%s` run of `%s` against `%s` failed.\n\njob results: `%s`\n\n%s\n' \
            "$TRIGGER" "$WORKFLOW" "$REF_NAME" "$RESULTS" "$RUN_URL")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still red. $RUN_URL"
          else
            number=$(gh issue create --title "$title" --label "$LABEL" --body "$body" \
              | grep -oE '[0-9]+$')
            # An issue with no assignee notifies nobody. Being subscribed is the whole point of
            # the alarm, and a failure to assign must not lose the issue that was opened - so
            # this is best-effort rather than part of the create.
            gh issue edit "$number" --add-assignee "$CONTACT" \
              || echo "::warning::could not assign #$number to $CONTACT; it is open and unassigned"
          fi
        elif [ -n "$existing" ]; then
          gh issue comment "$existing" --body "Green again as of $RUN_URL - closing."
          gh issue close "$existing"
        fi
