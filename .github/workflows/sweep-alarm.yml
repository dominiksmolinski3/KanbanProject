name: Sweep alarm

on:
  workflow_call:
    inputs:
      results:
        description: 'Space-separated needs.*.result values, one per job the caller waits on'
        required: true
        type: string
      subject:
        description: 'What failed, as it reads after the colon in the issue title'
        required: true
        type: string
      label:
        description: 'Label to open the issue under; also how the issue is found again'
        required: false
        default: sweep-red
        type: string

permissions:
  contents: read

jobs:
  alarm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
    - name: Open, update or close the issue for this sweep
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        RESULTS: ${{ inputs.results }}
        SUBJECT: ${{ inputs.subject }}
        LABEL: ${{ inputs.label }}
        WORKFLOW: ${{ github.workflow }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        REF_NAME: ${{ github.ref_name }}
        TRIGGER: ${{ github.event_name }}
        CONTACT: ${{ vars.SECURITY_CONTACT || github.repository_owner }}
      run: |
        set -euo pipefail

        red=false
        for result in $RESULTS; do
          if [ "$result" != "success" ]; then red=true; fi
        done

        title="$REF_NAME is red: $SUBJECT"

        gh label create "$LABEL" --color B60205 \
          --description "A scheduled sweep found something broken" --force >/dev/null

        existing=$(gh issue list --label "$LABEL" --state open --limit 100 --json number,title \
          | jq -r --arg title "$title" 'map(select(.title == $title)) | .[0].number // empty')

        if [ "$red" = true ]; then
          body=$(printf 'The `%s` run of `%s` against `%s` failed.\n\njob results: `%s`\n\n%s\n' \
            "$TRIGGER" "$WORKFLOW" "$REF_NAME" "$RESULTS" "$RUN_URL")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still red. $RUN_URL"
          else
            number=$(gh issue create --title "$title" --label "$LABEL" --body "$body" \
              | grep -oE '[0-9]+$')
            gh issue edit "$number" --add-assignee "$CONTACT" \
              || echo "::warning::could not assign #$number to $CONTACT; it is open and unassigned"
          fi
        elif [ -n "$existing" ]; then
          gh issue comment "$existing" --body "Green again as of $RUN_URL - closing."
          gh issue close "$existing"
        fi
