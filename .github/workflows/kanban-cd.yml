name: Kanban CD

on:
  push:
    branches: [ main ]
  # Optional: Run manually from GitHub UI
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        build-args: |
          VITE_RECAPTCHA_SITE_KEY=${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
        tags: ghcr.io/${{ github.repository_owner }}/kanbanproject-app:${{ github.sha }}
        cache-from: |
          type=registry,ref=ghcr.io/${{ github.repository_owner }}/kanbanproject-app:latest
          type=registry,ref=ghcr.io/${{ github.repository_owner }}/kanbanproject-app:${{ github.sha }}
        cache-to: type=inline

    - name: Scan image for vulnerabilities
      id: scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ghcr.io/${{ github.repository_owner }}/kanbanproject-app@${{ steps.build.outputs.digest }}
        format: sarif
        output: trivy-results.sarif
        severity: CRITICAL,HIGH
        limit-severities-for-sarif: true
        ignore-unfixed: true
        exit-code: '1'

    - name: Upload scan results to the Security tab
      if: always() && steps.scan.outcome != 'skipped'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results.sarif
        category: trivy-image

    - name: Promote the scanned image to :latest
      run: |
        docker buildx imagetools create \
          --tag ghcr.io/${{ github.repository_owner }}/kanbanproject-app:latest \
          ghcr.io/${{ github.repository_owner }}/kanbanproject-app@${{ steps.build.outputs.digest }}
