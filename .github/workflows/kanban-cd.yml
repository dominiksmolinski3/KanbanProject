name: Kanban CD

on:
  push:
    branches: [ main ]
  # Optional: Run manually from GitHub UI
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Log in to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Image
      id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        push: true
        build-args: |
          VITE_RECAPTCHA_SITE_KEY=${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
        tags: ghcr.io/${{ github.repository_owner }}/kanbanproject-app:${{ github.sha }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.licenses=MIT
        cache-from: |
          type=registry,ref=ghcr.io/${{ github.repository_owner }}/kanbanproject-app:latest
          type=registry,ref=ghcr.io/${{ github.repository_owner }}/kanbanproject-app:${{ github.sha }}
        cache-to: type=inline

    - name: Scan image for vulnerabilities
      id: scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ghcr.io/${{ github.repository_owner }}/kanbanproject-app@${{ steps.build.outputs.digest }}
        format: sarif
        output: trivy-results.sarif
        severity: CRITICAL,HIGH
        limit-severities-for-sarif: true
        ignore-unfixed: true
        exit-code: '1'

    - name: Upload scan results to the Security tab
      if: always() && hashFiles('trivy-results.sarif') != ''
      uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      with:
        sarif_file: trivy-results.sarif
        category: trivy-image

  promote:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Check that this commit is still the tip of main
      id: tip
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tip=$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq .sha)
        echo "main is at $tip, this run built ${{ github.sha }}"
        if [ "$tip" = "${{ github.sha }}" ]; then
          echo "is_tip=true" >> "$GITHUB_OUTPUT"
        else
          echo "is_tip=false" >> "$GITHUB_OUTPUT"
          echo "::notice::A newer commit is on ${{ github.ref_name }}; this image was built and scanned but will not be promoted to :latest."
        fi

    - name: Log in to GHCR
      if: steps.tip.outputs.is_tip == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Promote the scanned image to :latest
      if: steps.tip.outputs.is_tip == 'true'
      run: |
        docker buildx imagetools create \
          --tag ghcr.io/${{ github.repository_owner }}/kanbanproject-app:latest \
          ghcr.io/${{ github.repository_owner }}/kanbanproject-app@${{ needs.build-and-push.outputs.digest }}

    - name: Verify main did not move while promoting
      if: steps.tip.outputs.is_tip == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tip=$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq .sha)
        if [ "$tip" != "${{ github.sha }}" ]; then
          echo "::warning::main moved to $tip while this job was promoting; :latest may point at the older ${{ github.sha }} and need promoting by hand."
        fi
