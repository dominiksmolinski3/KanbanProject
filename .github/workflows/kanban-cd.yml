name: Kanban CD

on:
  push:
    branches: [ main ]
  # The same hole `kanban-ci.yml` sweeps, and it was still open here after that one was closed: a
  # push made with the default GITHUB_TOKEN starts no workflow run, and `dependabot-auto-merge.yml`
  # merges with exactly that token. Measured on 12 Sep 2026 - five consecutive merge commits
  # (974b764, f8817f7, b5c8f11, ed9d463, 549e343) reached `main` with no CI, no CodeQL and no CD
  # behind any of them. For CI that meant an untested trunk, which the sweep there now catches.
  # Here it means something quieter: no image was built for those commits at all, so `:latest`
  # stopped tracking the tip of `main` and nothing said so. A daily rebuild of the tip is what
  # makes `:latest` converge again, whoever did the merging.
  #
  # Half an hour after the CI sweep, so that the tree this builds has just been swept.
  schedule:
    - cron: '47 5 * * *'
  # Optional: Run manually from GitHub UI
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Two images since the container split, built as a matrix rather than as two jobs.
  #
  # That is not only tidiness. `cd-alarm` below has to name every job in `needs` *and* in the
  # `results` string it passes, and SweepAlarmCoverageTest fails the build when those two disagree
  # - so a second build job would be a third place to remember. A matrix leg is not a job by that
  # reckoning: `needs.build-and-push.result` aggregates every leg, and a leg that fails fails the
  # whole reference. One name, whatever the matrix grows to.
  #
  # `fail-fast: false` so that a Trivy finding in one image still tells you about the other; and
  # `promote` needs both legs green either way, because `needs` on a matrix job waits for all of
  # them.
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kanbanproject-app
            context: backend
            dockerfile: backend/Dockerfile
          - image: kanbanproject-web
            context: frontend
            dockerfile: frontend/Dockerfile

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Log in to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # The site key is only read by the frontend build; passing it to the backend context is
    # harmless (that Dockerfile declares no such ARG) and keeps the matrix leg uniform.
    - name: Build and Push Docker Image
      id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.dockerfile }}
        push: true
        build-args: |
          VITE_RECAPTCHA_SITE_KEY=${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
        tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.licenses=MIT
        cache-from: |
          type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
        cache-to: type=inline

    - name: Scan image for vulnerabilities
      id: scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        format: sarif
        output: trivy-results.sarif
        severity: CRITICAL,HIGH
        limit-severities-for-sarif: true
        ignore-unfixed: true
        exit-code: '1'

    # A category per image. Uploading both under one category makes the second leg's results
    # replace the first's, so the Security tab would show whichever leg happened to finish last
    # and report the other image as having no findings at all.
    - name: Upload scan results to the Security tab
      if: always() && hashFiles('trivy-results.sarif') != ''
      uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      with:
        sarif_file: trivy-results.sarif
        category: trivy-image-${{ matrix.image }}

    - name: Generate SBOM
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        format: cyclonedx
        output: sbom.cdx.json

    # Named per image for the same reason: two legs uploading one artifact name is an error, and
    # an SBOM that does not say which image it describes is not an SBOM.
    - name: Upload SBOM artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sbom-${{ matrix.image }}-${{ github.sha }}
        path: sbom.cdx.json
        if-no-files-found: error

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    # Keyless signing: cosign gets a short-lived certificate from Sigstore's Fulcio CA
    # bound to this workflow's GitHub OIDC identity, so there is no signing key to
    # store or rotate. Both the signature and the SBOM attestation are pushed
    # alongside the image in GHCR, addressed by the digest so they cannot drift onto
    # a different build the way a tag-addressed reference could.
    - name: Sign the image (keyless)
      run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}"

    - name: Attest the SBOM
      run: cosign attest --yes --predicate sbom.cdx.json --type cyclonedx "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}"

  promote:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    # Two questions, and only the second one was ever asked. `:latest` means "the tip of the default
    # branch", so promoting requires both that this ref *is* that branch and that this commit is
    # still its tip. The ref half was missing, and `workflow_dispatch` has been on this workflow all
    # along - so dispatching CD on a feature branch tagged that branch's build `:latest`, because
    # the commit is perfectly well the tip of the ref it names. Nothing had ever done it. Adding a
    # schedule is a reason to make sure nothing can.
    - name: Check that this is the tip of the default branch
      id: tip
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        if [ "${{ github.ref_name }}" != "$DEFAULT_BRANCH" ]; then
          echo "is_tip=false" >> "$GITHUB_OUTPUT"
          echo "::notice::This ran on ${{ github.ref_name }}, not $DEFAULT_BRANCH; the image was built and scanned but will not be promoted to :latest."
          exit 0
        fi
        tip=$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq .sha)
        echo "$DEFAULT_BRANCH is at $tip, this run built ${{ github.sha }}"
        if [ "$tip" = "${{ github.sha }}" ]; then
          echo "is_tip=true" >> "$GITHUB_OUTPUT"
        else
          echo "is_tip=false" >> "$GITHUB_OUTPUT"
          echo "::notice::A newer commit is on ${{ github.ref_name }}; this image was built and scanned but will not be promoted to :latest."
        fi

    - name: Log in to GHCR
      if: steps.tip.outputs.is_tip == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Both or neither, and by tag rather than by digest.
    #
    # A matrix job's outputs are whichever leg wrote them last, so there is no per-image digest to
    # read here any more - `imagetools create` resolves the SHA tag instead, which is the same
    # artifact this run built and pushed. The tag is immutable in practice because every run tags
    # by commit.
    #
    # The two must move together. Terraform feeds one app_image_tag to both container apps, and the
    # bundle disagreeing with the API it calls is the failure the split introduced - a `:latest`
    # that is half of one commit and half of another is exactly that, with nothing to say so.
    - name: Promote the scanned images to :latest
      if: steps.tip.outputs.is_tip == 'true'
      run: |
        for image in kanbanproject-app kanbanproject-web; do
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository_owner }}/$image:latest" \
            "ghcr.io/${{ github.repository_owner }}/$image:${{ github.sha }}"
        done

    - name: Verify main did not move while promoting
      if: steps.tip.outputs.is_tip == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tip=$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq .sha)
        if [ "$tip" != "${{ github.sha }}" ]; then
          echo "::warning::main moved to $tip while this job was promoting; :latest on both images may point at the older ${{ github.sha }} and need promoting by hand."
        fi

  # A sweep has nobody watching it, which is the whole argument in `sweep-alarm.yml`. It matters
  # more here than on CI: a red CI sweep at least leaves a red tick against `main`, while a CD
  # sweep that fails leaves `:latest` pointing at an older commit, which looks exactly like a
  # deployment nobody has made yet.
  cd-alarm:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [ build-and-push, promote ]
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/sweep-alarm.yml
    with:
      results: "${{ needs.build-and-push.result }} ${{ needs.promote.result }}"
      subject: the image sweep failed
      label: cd-red
