name: Kanban CD

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kanbanproject-app
            context: backend
            dockerfile: backend/Dockerfile
          - image: kanbanproject-web
            context: frontend
            dockerfile: frontend/Dockerfile

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

    - name: Log in to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Image
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.dockerfile }}
        push: true
        build-args: |
          VITE_RECAPTCHA_SITE_KEY=${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
        tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.licenses=MIT
        cache-from: |
          type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
        cache-to: type=inline

    - name: Scan image for vulnerabilities
      id: scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        format: sarif
        output: trivy-results.sarif
        severity: CRITICAL,HIGH
        limit-severities-for-sarif: true
        ignore-unfixed: true
        exit-code: '1'

    - name: Upload scan results to the Security tab
      if: always() && hashFiles('trivy-results.sarif') != ''
      uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      with:
        sarif_file: trivy-results.sarif
        category: trivy-image-${{ matrix.image }}

    - name: Generate SBOM
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        format: cyclonedx
        output: sbom.cdx.json

    - name: Upload SBOM artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sbom-${{ matrix.image }}-${{ github.sha }}
        path: sbom.cdx.json
        if-no-files-found: error

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Sign the image (keyless)
      run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}"

    - name: Attest the SBOM
      run: cosign attest --yes --predicate sbom.cdx.json --type cyclonedx "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}"

  promote:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Check that this is the tip of the default branch
      id: tip
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        if [ "${{ github.ref_name }}" != "$DEFAULT_BRANCH" ]; then
          echo "is_tip=false" >> "$GITHUB_OUTPUT"
          echo "::notice::This ran on ${{ github.ref_name }}, not $DEFAULT_BRANCH; the image was built and scanned but will not be promoted to :latest."
          exit 0
        fi
        tip=$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq .sha)
        echo "$DEFAULT_BRANCH is at $tip, this run built ${{ github.sha }}"
        if [ "$tip" = "${{ github.sha }}" ]; then
          echo "is_tip=true" >> "$GITHUB_OUTPUT"
        else
          echo "is_tip=false" >> "$GITHUB_OUTPUT"
          echo "::notice::A newer commit is on ${{ github.ref_name }}; this image was built and scanned but will not be promoted to :latest."
        fi

    - name: Log in to GHCR
      if: steps.tip.outputs.is_tip == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Promote the scanned images to :latest
      if: steps.tip.outputs.is_tip == 'true'
      run: |
        for image in kanbanproject-app kanbanproject-web; do
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository_owner }}/$image:latest" \
            "ghcr.io/${{ github.repository_owner }}/$image:${{ github.sha }}"
        done

    - name: Verify main did not move while promoting
      if: steps.tip.outputs.is_tip == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tip=$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq .sha)
        if [ "$tip" != "${{ github.sha }}" ]; then
          echo "::warning::main moved to $tip while this job was promoting; :latest on both images may point at the older ${{ github.sha }} and need promoting by hand."
        fi

  cd-alarm:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [ build-and-push, promote ]
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/sweep-alarm.yml
    with:
      results: "${{ needs.build-and-push.result }} ${{ needs.promote.result }}"
      subject: the image sweep failed
      label: cd-red
