name: Kanban CD

on:
  push:
    branches: [ main ]
  # Optional: Run manually from GitHub UI
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        
    - name: Log in to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Image
      id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        push: true
        build-args: |
          VITE_RECAPTCHA_SITE_KEY=${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
        tags: ghcr.io/${{ github.repository_owner }}/kanbanproject-app:${{ github.sha }}
        cache-from: |
          type=registry,ref=ghcr.io/${{ github.repository_owner }}/kanbanproject-app:latest
          type=registry,ref=ghcr.io/${{ github.repository_owner }}/kanbanproject-app:${{ github.sha }}
        cache-to: type=inline

    - name: Scan image for vulnerabilities
      id: scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ghcr.io/${{ github.repository_owner }}/kanbanproject-app@${{ steps.build.outputs.digest }}
        format: sarif
        output: trivy-results.sarif
        severity: CRITICAL,HIGH
        limit-severities-for-sarif: true
        ignore-unfixed: true
        exit-code: '1'

    - name: Upload scan results to the Security tab
      if: always() && hashFiles('trivy-results.sarif') != ''
      uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      with:
        sarif_file: trivy-results.sarif
        category: trivy-image

    - name: Promote the scanned image to :latest
      run: |
        docker buildx imagetools create \
          --tag ghcr.io/${{ github.repository_owner }}/kanbanproject-app:latest \
          ghcr.io/${{ github.repository_owner }}/kanbanproject-app@${{ steps.build.outputs.digest }}
