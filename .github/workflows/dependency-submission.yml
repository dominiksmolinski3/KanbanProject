name: Dependency submission

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/pom.xml'
      - 'frontend/android/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/dependency-submission.yml'
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '29 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  maven:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK 25
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Set executable permissions for mvnw
      run: chmod +x backend/mvnw

    - name: Submit the resolved Maven graph
      uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
      with:
        directory: ${{ github.workspace }}/backend

  gradle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VITE_API_ORIGIN: https://kanban.invalid
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Set up JDK 21
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Generate the Android project the APK is built from
      working-directory: frontend
      run: |
        npm ci
        npm run cap:sync

    - name: Submit the resolved Gradle graph
      uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        build-root-directory: frontend/android

  submission-alarm:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [ maven, gradle ]
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/sweep-alarm.yml
    with:
      results: "${{ needs.maven.result }} ${{ needs.gradle.result }}"
      subject: the dependency graph was not submitted
      label: sweep-red
