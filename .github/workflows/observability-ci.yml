name: Observability CI

on:
  push:
    branches: [ main ]
    paths:
      - 'observability/**'
      - 'ansible/**'
      - 'docker-compose.yml'
      - '.github/workflows/observability-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'observability/**'
      - 'ansible/**'
      - 'docker-compose.yml'
      - '.github/workflows/observability-ci.yml'

permissions:
  contents: read

jobs:
  prometheus-and-grafana:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull Docker Hub images through a mirror
        uses: ./.github/actions/docker-hub-mirror

      - name: Read the Prometheus image the stack runs
        run: |
          image=$(grep -oE 'prom/prometheus:[^[:space:]]+' docker-compose.yml)
          test -n "$image"
          echo "PROMETHEUS_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Check the configuration and the rules, once per environment's scrape file
        run: |
          for scrape in observability/prometheus/scrape/*.yml; do
            echo "== with $scrape"
            docker run --rm \
              -v "$PWD/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
              -v "$PWD/observability/prometheus/rules:/etc/prometheus/rules:ro" \
              -v "$PWD/$scrape:/etc/prometheus/scrape/$(basename "$scrape"):ro" \
              --entrypoint promtool "$PROMETHEUS_IMAGE" check config /etc/prometheus/prometheus.yml
          done
          docker run --rm -v "$PWD/observability/prometheus:/etc/prometheus:ro" --entrypoint sh \
            "$PROMETHEUS_IMAGE" -c 'promtool check rules /etc/prometheus/rules/*.yml'

      - name: Test the rules
        run: |
          docker run --rm -v "$PWD/observability/prometheus:/etc/prometheus:ro" --entrypoint sh \
            "$PROMETHEUS_IMAGE" -c 'promtool test rules /etc/prometheus/rules/tests/*.yml'

      - name: Lint the dashboards
        run: |
          python3 - <<'PY'
          import glob, json
          # The local stack has only Prometheus; the Azure folder ships in the Azure image alone.
          folders = {"observability/grafana/dashboards": "prometheus",
                     "observability/grafana/azure/dashboards": "azure-monitor"}
          uids = []
          for folder, source in folders.items():
              for path in glob.glob(f"{folder}/*.json"):
                  dashboard = json.load(open(path))
                  for key in ("uid", "title", "panels"):
                      assert dashboard.get(key), f"{path}: no {key}"
                  uids.append(dashboard["uid"])
                  for panel in dashboard["panels"]:
                      if panel["type"] != "row":
                          assert panel["datasource"]["uid"] == source, f"{path}: {panel['title']} is not on {source}"
          assert len(uids) == len(set(uids)), f"duplicate dashboard uid in {sorted(uids)}"
          print(f"{len(uids)} dashboards")
          PY

  ansible:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull Docker Hub images through a mirror
        uses: ./.github/actions/docker-hub-mirror

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install the same Ansible the VM gets from apt, and the test tools
        run: pip install "ansible==9.2.0" "ansible-lint==26.9.0" "molecule==26.9.0" "molecule-plugins[docker]==26.9.28" "docker==7.2.0"

      - name: Lint the playbook
        run: ansible-lint --profile production

      - name: Converge twice in a container and verify who may reach what
        run: molecule test
