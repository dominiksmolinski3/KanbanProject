name: Rerun on rate limit

on:
  workflow_run:
    workflows:
      - Android CI
      - Base images
      - CodeQL
      - DAST (OWASP ZAP)
      - Dependency review
      - Dependency submission
      - Dependency vulnerability sweep
      - Deployed contract sweep
      - DHI package pins refresh
      - External attack-surface scan
      - Gradle wrapper
      - Hadolint
      - Infrastructure CI
      - Kanban CD
      - Kanban CI
      - Migration order
      - Monitoring VM drift sweep
      - npm lockfile refresh
      - Observability CI
      - OpenSSF Scorecard
      - Release images
      - Stale exceptions
      - Terraform drift sweep
      - Workflow lint
    types: [ completed ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Rerun the failed jobs once if a registry refused them
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        RUN_ID: ${{ github.event.workflow_run.id }}
        RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      run: python3 .github/scripts/rate_limit_rerun.py
