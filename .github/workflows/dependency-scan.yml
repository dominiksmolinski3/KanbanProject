name: Dependency vulnerability sweep

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-fs-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set executable permissions for mvnw
        run: chmod +x backend/mvnw

      # Trivy reads pom.xml, and every version here comes from spring-boot-starter-parent
      # or an imported BOM. With an empty ~/.m2 it fetches each one from Maven Central and
      # is rate-limited into a FATAL; its own error names this as the fix.
      - name: Populate the local Maven repository
        working-directory: backend
        run: ./mvnw --batch-mode -q dependency:resolve

      - name: Scan repository dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_FILE_PATTERNS: 'pip:requirements-.*\.txt'
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload scan results to the Security tab
        if: always() && hashFiles('trivy-fs-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

  terraform-images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: List the images Terraform pins
        id: list
        run: |
          set -euo pipefail
          images=$(git grep -hoE 'image[[:space:]]*=[[:space:]]*"[^"$]+"' -- 'terraform/*.tf' \
            | sed -E 's/^image[[:space:]]*=[[:space:]]*"(.*)"$/\1/' | sort -u)
          if [ -z "$images" ]; then
            echo "::error::no image is pinned under terraform/, so this sweep would check nothing"
            exit 1
          fi
          echo "$images"
          echo "images=$(jq -Rnc '[inputs | {ref: ., name: (split("@")[0] | gsub("[/:]"; "-"))}]' <<<"$images")" >> "$GITHUB_OUTPUT"

  terraform-image-scan:
    needs: terraform-images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.terraform-images.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull Docker Hub images through a mirror
        uses: ./.github/actions/docker-hub-mirror

      - name: Pull ${{ matrix.image.name }}
        env:
          IMAGE: ${{ matrix.image.ref }}
        run: docker pull -q "$IMAGE"

      - name: Scan ${{ matrix.image.name }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image.ref }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: '1'
          skip-files: usr/local/bin/gosu

      - name: Upload scan results to the Security tab
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy-terraform-${{ matrix.image.name }}

  monitoring-binary-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unpack the binaries the monitoring VM installs
        run: |
          set -euo pipefail
          binaries=$(yq -o=json '.monitoring_binaries // []' ansible/group_vars/all.yml)
          if [ "$(jq length <<<"$binaries")" -eq 0 ]; then
            echo "::error::monitoring_binaries lists nothing, so this sweep would check nothing"
            exit 1
          fi
          while IFS=$'\t' read -r name version sha256 executables deb; do
            url=${deb:-https://github.com/prometheus/$name/releases/download/v$version/$name-$version.linux-amd64.tar.gz}
            echo "$name $version from $url"
            curl -fsSL --retry 3 -o download "$url"
            sha256sum -c - <<<"$sha256  download"
            mkdir -p "monitoring-binaries/$name"
            case "$url" in
              *.deb) dpkg-deb --extract download "monitoring-binaries/$name" ;;
              *) tar -xzf download -C "monitoring-binaries/$name" ;;
            esac
            rm download
            for executable in $executables; do
              if [ -z "$(find "monitoring-binaries/$name" -type f -name "$executable")" ]; then
                echo "::error::$name unpacked without $executable, so this sweep would not scan it"
                exit 1
              fi
            done
          done < <(jq -r '.[] | [.name, .version, .sha256, (.executables | join(" ")), (.deb // "")] | @tsv' <<<"$binaries")

      - name: Scan the binaries
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: rootfs
          scan-ref: monitoring-binaries
          format: sarif
          output: trivy-monitoring-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload scan results to the Security tab
        if: always() && hashFiles('trivy-monitoring-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-monitoring-results.sarif
          category: trivy-monitoring-binaries

  scan-alarm:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [ trivy-fs-scan, terraform-images, terraform-image-scan, monitoring-binary-scan ]
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/sweep-alarm.yml
    with:
      results: "${{ needs.trivy-fs-scan.result }} ${{ needs.terraform-images.result }} ${{ needs.terraform-image-scan.result }} ${{ needs.monitoring-binary-scan.result }}"
      subject: the dependency vulnerability sweep failed
      label: scan-red
