name: Kanban CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # A push made with the default GITHUB_TOKEN does not start a workflow run. Dependabot's
  # auto-merge job merges with exactly that token, so the merge commits it produces reach main
  # with no CI behind them - which is how react and react-dom ended up on different versions and
  # the trunk's entire frontend suite stopped starting, unnoticed until it broke somebody else's
  # pull request an hour later. The `push` trigger above is not wrong; it is simply never reached
  # on that path. This sweep is what reaches it.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'kanban_ci' }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'kanban_ci' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'kanban_ci' }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'Y2ktb25seS1zaWduaW5nLWtleS1ub3QtYS1yZWFsLXNlY3JldA==' }}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'kanban_ci' }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'kanban_ci' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'kanban_ci' }}
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK 25
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Set executable permissions for mvnw
      run: chmod +x backend/mvnw

    - name: Create .env file
      working-directory: backend
      run: |
        cat > .env <<EOF
        SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
        SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
        SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
        JWT_SECRET_KEY=${JWT_SECRET_KEY}
        EOF

    - name: Build and test backend
      working-directory: backend
      run: ./mvnw --batch-mode clean verify

    - name: Upload test coverage
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-coverage
        path: backend/target/site/jacoco
        if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 26
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: frontend
      run: npm ci --legacy-peer-deps

    - name: Build frontend
      working-directory: frontend
      run: npm run build

    - name: Run linting
      working-directory: frontend
      run: npm run lint

    - name: Run tests with coverage
      working-directory: frontend
      run: npm run test:coverage

    - name: Upload test coverage
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: frontend-test-coverage
        path: frontend/coverage

  e2e:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'kanban_ci' }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'kanban_ci' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'kanban_ci' }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'Y2ktb25seS1zaWduaW5nLWtleS1ub3QtYS1yZWFsLXNlY3JldA==' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 26
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Create .env file for docker-compose
      run: |
        cat > .env <<EOF
        SPRING_DATASOURCE_DB=${POSTGRES_DB}
        SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
        SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
        JWT_SECRET_KEY=${JWT_SECRET_KEY}
        ACS_EMAIL_CONNECTION_STRING=
        ACS_EMAIL_SENDER_ADDRESS=
        AZURE_STORAGE_CONNECTION_STRING=
        CAPTCHA_ENABLED=false
        CAPTCHA_SECRET=
        VITE_RECAPTCHA_SITE_KEY=
        EOF

    - name: Build and start the stack
      run: docker compose up -d --build

    # :8081 is the API container's own port. The edge deliberately does not proxy /actuator, so
    # asking :8080 for it would be asking nginx a question it is built to refuse.
    - name: Wait for the backend to become healthy
      run: |
        for i in $(seq 1 60); do
          if curl -fs http://localhost:8081/actuator/health/readiness | grep -q '"status":"UP"'; then
            echo "backend is up"
            exit 0
          fi
          sleep 5
        done
        echo "backend never became healthy" >&2
        docker compose logs app
        exit 1

    # The other half, and the reason this job is worth more than it was: everything below goes
    # through nginx on :8080, so a broken proxy rule, a missing header or a body size limit fails
    # here rather than on the deployment.
    - name: Check that the edge is serving the bundle and proxying the API
      run: |
        for i in $(seq 1 30); do
          if curl -fs http://localhost:8080/healthz >/dev/null; then break; fi
          sleep 2
        done
        set -e
        curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
        curl -fsS -o /dev/null http://localhost:8080/board
        curl -fsS http://localhost:8080/v3/api-docs | grep -q '"openapi"'
        # The shell must carry the policy nginx adds, not nothing - add_header does not inherit
        # into a location that sets one of its own, which is the trap this catches.
        curl -fsSI http://localhost:8080/ | grep -qi '^content-security-policy:'
        # And the API app must not be reachable through the edge on anything but /api and /ws.
        test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health)" = "404"
        # A refusal rather than a 404: the request reached Spring, which turned it away.
        case "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/columns)" in
          401|403) ;;
          *) echo "/api is not reaching the API container" >&2; exit 1 ;;
        esac

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci --legacy-peer-deps

    - name: Seed the Cypress test account
      working-directory: frontend
      env:
        SEED_API_BASE_URL: http://localhost:8080/api
        SEED_PGHOST: localhost
        SEED_PGPORT: 5432
        SEED_PGDATABASE: ${{ env.POSTGRES_DB }}
        SEED_PGUSER: ${{ env.POSTGRES_USER }}
        SEED_PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
      run: npm run cypress:seed

    - name: Run Cypress
      working-directory: frontend
      env:
        CYPRESS_BASE_URL: http://localhost:8080
      run: npm run cypress:run

    - name: Upload Cypress artifacts
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: cypress-artifacts
        path: |
          frontend/cypress/screenshots
          frontend/cypress/videos
        if-no-files-found: ignore

    - name: Tear down the stack
      if: always()
      run: docker compose down -v

  # kanban-cd.yml's Trivy gate only ever runs on push to main, after a PR has already merged - so
  # a base image that picks up a fresh HIGH between when a PR was opened and when it merges goes
  # red on `main`, not on the PR that would have carried the fix or at least the warning. #160
  # (fix/web-image-base-cves) was exactly that shape: the gate caught it, but only after the merge,
  # and `promote` correctly withheld `:latest` until it was fixed on a second PR. Building and
  # scanning here does not remove that CD gate - the SHA-tagged image CD builds still gets its own
  # scan before promotion - it just gives the same answer earlier, while an author is still looking
  # at the PR instead of a day later on a cron.
  #
  # Same matrix shape as kanban-cd.yml's build-and-push, and for the same reason: a second job here
  # would be a second place for SweepAlarmCoverageTest's `needs`/`results` coupling to drift.
  # Nothing is pushed to GHCR - `load: true` keeps the image in the local daemon, which is all a
  # scan needs and avoids requiring registry write access on a pull_request run.
  image-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kanbanproject-app
            context: backend
            dockerfile: backend/Dockerfile
          - image: kanbanproject-web
            context: frontend
            dockerfile: frontend/Dockerfile

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Build image (not pushed)
      id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.dockerfile }}
        push: false
        load: true
        build-args: |
          VITE_RECAPTCHA_SITE_KEY=${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
        tags: ${{ matrix.image }}:pr-${{ github.sha }}

    # Same severity set, same ignore-unfixed, same exit-code as the post-merge scan in
    # kanban-cd.yml - a PR either passes both or neither, it never sees a looser gate than main.
    - name: Scan image for vulnerabilities
      id: scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ matrix.image }}:pr-${{ github.sha }}
        format: sarif
        output: trivy-results.sarif
        severity: CRITICAL,HIGH
        limit-severities-for-sarif: true
        ignore-unfixed: true
        exit-code: '1'

    - name: Upload scan results to the Security tab
      if: always() && hashFiles('trivy-results.sarif') != ''
      uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      with:
        sarif_file: trivy-results.sarif
        category: trivy-pr-${{ matrix.image }}

  # ---------------------------------------------------------------------------------------------
  # The half that tells somebody.
  #
  # A red run in the Actions tab answers whoever goes and looks; this exists for the far commoner
  # case of nobody looking, which is the shape `MailHealthIndicator` and the dead-letter alert
  # already have. It fires on the sweep and not on a pull request or a push: a pull request that
  # goes red already has an author staring at it, and a push that goes red was pushed by somebody.
  #
  # `workflow_dispatch` counts as the sweep, and that is a correction rather than a widening. The
  # trigger was added so that confirming a fix need not wait a day for the cron - but this
  # condition named `schedule` alone, so a manual run executed the suite and skipped this job.
  # The whole alarm was therefore unreachable except by a cron that happened to be red, which is
  # not a path anybody can exercise on purpose: `gh issue create`, the `issues: write` grant and
  # the label creation below were all code nothing had ever run. An alarm that cannot be tested is
  # an alarm nobody should believe, and a dispatch has the same subject a cron does - somebody
  # asked for a sweep of this ref, rather than pushing a commit and watching it.
  #
  # What a dispatch does change is that the run may be on a branch, and the issue then has to say
  # which ref it is about. The title carries `github.ref_name` for that reason, and the lookup
  # below matches on that title rather than on the label alone - otherwise a sweep dispatched on a
  # green feature branch would close the issue saying `main` is broken, which is a worse failure
  # than the one this job exists to prevent.
  #
  # It closes the issue again when the sweep comes back green, for the reason the mail indicator
  # windows its DOWN to a day - a status that cannot clear is one people stop reading.
  #
  # `needs` has to name every other job in this workflow, and the `results` string below has to
  # name every job in `needs`. Nothing in YAML enforces either, and a job left out of one of the
  # two lists fails without this one noticing, so SweepAlarmCoverageTest reads this file and fails
  # the build when they disagree. That same test reads the trigger block against the condition
  # below, because the first gap here was precisely that coupling: a trigger meant for this job
  # that this job did not answer to.
  #
  # The script itself now lives in `sweep-alarm.yml`, because three other unattended workflows
  # needed the same thing and four copies of one shell script is four chances to fix a bug once.
  trunk-alarm:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [ backend, frontend, e2e, image-scan ]
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/sweep-alarm.yml
    with:
      results: "${{ needs.backend.result }} ${{ needs.frontend.result }} ${{ needs.e2e.result }} ${{ needs.image-scan.result }}"
      subject: the trunk sweep failed
      label: trunk-red
