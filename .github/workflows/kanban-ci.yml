name: Kanban CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # A push made with the default GITHUB_TOKEN does not start a workflow run. Dependabot's
  # auto-merge job merges with exactly that token, so the merge commits it produces reach main
  # with no CI behind them - which is how react and react-dom ended up on different versions and
  # the trunk's entire frontend suite stopped starting, unnoticed until it broke somebody else's
  # pull request an hour later. The `push` trigger above is not wrong; it is simply never reached
  # on that path. This sweep is what reaches it.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'kanban_ci' }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'kanban_ci' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'kanban_ci' }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'Y2ktb25seS1zaWduaW5nLWtleS1ub3QtYS1yZWFsLXNlY3JldA==' }}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'kanban_ci' }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'kanban_ci' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'kanban_ci' }}
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK 25
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Set executable permissions for mvnw
      run: chmod +x backend/mvnw

    - name: Create .env file
      working-directory: backend
      run: |
        cat > .env <<EOF
        SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
        SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
        SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
        JWT_SECRET_KEY=${JWT_SECRET_KEY}
        EOF

    - name: Build and test backend
      working-directory: backend
      run: ./mvnw --batch-mode clean verify

    - name: Upload test coverage
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-coverage
        path: backend/target/site/jacoco
        if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 26
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: frontend
      run: npm ci --legacy-peer-deps

    - name: Build frontend
      working-directory: frontend
      run: npm run build

    - name: Run linting
      working-directory: frontend
      run: npm run lint

    - name: Run tests with coverage
      working-directory: frontend
      run: npm run test:coverage

    - name: Upload test coverage
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: frontend-test-coverage
        path: frontend/coverage

  e2e:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'kanban_ci' }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'kanban_ci' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'kanban_ci' }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'Y2ktb25seS1zaWduaW5nLWtleS1ub3QtYS1yZWFsLXNlY3JldA==' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 26
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Create .env file for docker-compose
      run: |
        cat > .env <<EOF
        SPRING_DATASOURCE_DB=${POSTGRES_DB}
        SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
        SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
        JWT_SECRET_KEY=${JWT_SECRET_KEY}
        ACS_EMAIL_CONNECTION_STRING=
        ACS_EMAIL_SENDER_ADDRESS=
        AZURE_STORAGE_CONNECTION_STRING=
        CAPTCHA_ENABLED=false
        CAPTCHA_SECRET=
        VITE_RECAPTCHA_SITE_KEY=
        EOF

    - name: Build and start the stack
      run: docker compose up -d --build

    - name: Wait for the backend to become healthy
      run: |
        for i in $(seq 1 60); do
          if curl -fs http://localhost:8080/actuator/health/readiness | grep -q '"status":"UP"'; then
            echo "backend is up"
            exit 0
          fi
          sleep 5
        done
        echo "backend never became healthy" >&2
        docker compose logs app
        exit 1

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci --legacy-peer-deps

    - name: Seed the Cypress test account
      working-directory: frontend
      env:
        SEED_API_BASE_URL: http://localhost:8080/api
        SEED_PGHOST: localhost
        SEED_PGPORT: 5432
        SEED_PGDATABASE: ${{ env.POSTGRES_DB }}
        SEED_PGUSER: ${{ env.POSTGRES_USER }}
        SEED_PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
      run: npm run cypress:seed

    - name: Run Cypress
      working-directory: frontend
      env:
        CYPRESS_BASE_URL: http://localhost:8080
      run: npm run cypress:run

    - name: Upload Cypress artifacts
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: cypress-artifacts
        path: |
          frontend/cypress/screenshots
          frontend/cypress/videos
        if-no-files-found: ignore

    - name: Tear down the stack
      if: always()
      run: docker compose down -v

  # ---------------------------------------------------------------------------------------------
  # The half that tells somebody.
  #
  # A red run in the Actions tab answers whoever goes and looks; this exists for the far commoner
  # case of nobody looking, which is the shape `MailHealthIndicator` and the dead-letter alert
  # already have. It only fires on the scheduled sweep: a pull request that goes red already has
  # an author staring at it, and a push that goes red was pushed by somebody.
  #
  # It closes the issue again when the sweep comes back green, for the reason the mail indicator
  # windows its DOWN to a day - a status that cannot clear is one people stop reading.
  #
  # `needs` has to name every other job in this workflow. Nothing in YAML enforces that, and a job
  # added later and left out of the list would fail without this one noticing, so
  # TrunkAlarmCoverageTest reads this file and fails the build when the two disagree.
  trunk-alarm:
    if: always() && github.event_name == 'schedule'
    needs: [ backend, frontend, e2e ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
    - name: Open, update or close the trunk-red issue
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        RESULTS: "${{ needs.backend.result }} ${{ needs.frontend.result }} ${{ needs.e2e.result }}"
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail

        # Anything that is not a pass is red. `skipped` is included deliberately: a job that did
        # not run is a job that proved nothing, and reading that as green is how this whole gap
        # came about in the first place.
        red=false
        for result in $RESULTS; do
          if [ "$result" != "success" ]; then red=true; fi
        done

        # --force makes this idempotent; `gh issue create --label` fails outright on a label that
        # does not exist yet, which would make the very first alarm the one that gets lost.
        gh label create trunk-red --color B60205 \
          --description "The scheduled sweep found main broken" --force >/dev/null

        existing=$(gh issue list --label trunk-red --state open --limit 1 --json number \
          --jq '.[0].number // empty')

        if [ "$red" = true ]; then
          body=$(printf 'The scheduled run of `Kanban CI` against `main` failed.\n\nbackend / frontend / e2e: `%s`\n\n%s\n' "$RESULTS" "$RUN_URL")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still red. $RUN_URL"
          else
            gh issue create --title "main is red: the scheduled trunk sweep failed" \
              --label trunk-red --body "$body"
          fi
        elif [ -n "$existing" ]; then
          gh issue comment "$existing" --body "Green again as of $RUN_URL - closing."
          gh issue close "$existing"
        fi
