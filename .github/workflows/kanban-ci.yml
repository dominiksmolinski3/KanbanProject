name: Kanban CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs on a branch are pointless; on main and on the sweeps every run is
# the record of a distinct commit, so those queue rather than cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'kanban_ci' }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'kanban_ci' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'kanban_ci' }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'Y2ktb25seS1zaWduaW5nLWtleS1ub3QtYS1yZWFsLXNlY3JldA==' }}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'kanban_ci' }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'kanban_ci' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'kanban_ci' }}
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK 25
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Set executable permissions for mvnw
      run: chmod +x backend/mvnw

    - name: Create .env file
      working-directory: backend
      run: |
        cat > .env <<EOF
        SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
        SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
        SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
        JWT_SECRET_KEY=${JWT_SECRET_KEY}
        EOF

    - name: Build and test backend
      working-directory: backend
      run: ./mvnw --batch-mode clean verify

    - name: Analyze dependencies (informational)
      working-directory: backend
      continue-on-error: true
      run: ./mvnw --batch-mode dependency:analyze

    - name: Upload test coverage
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-coverage
        path: backend/target/site/jacoco
        if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 26
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: frontend
      run: npm ci --legacy-peer-deps

    - name: Build frontend
      working-directory: frontend
      run: npm run build

    - name: Check bundle size budget
      working-directory: frontend
      run: npm run check:bundle-size

    - name: Run linting
      working-directory: frontend
      run: npm run lint

    - name: Run tests with coverage
      working-directory: frontend
      run: npm run test:coverage

    - name: Upload test coverage
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: frontend-test-coverage
        path: frontend/coverage

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3 ]
    env:
      POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'kanban_ci' }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'kanban_ci' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'kanban_ci' }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'Y2ktb25seS1zaWduaW5nLWtleS1ub3QtYS1yZWFsLXNlY3JldA==' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 26
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Create .env file for docker-compose
      run: |
        cat > .env <<EOF
        SPRING_DATASOURCE_DB=${POSTGRES_DB}
        SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
        SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
        JWT_SECRET_KEY=${JWT_SECRET_KEY}
        ACS_EMAIL_CONNECTION_STRING=
        ACS_EMAIL_SENDER_ADDRESS=
        AZURE_STORAGE_CONNECTION_STRING=
        CAPTCHA_ENABLED=false
        CAPTCHA_SECRET=
        VITE_RECAPTCHA_SITE_KEY=
        EOF

    - name: Cache the Cypress binary
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/Cypress
        key: cypress-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

    - name: Install frontend dependencies
      working-directory: frontend
      run: |
        npm ci --legacy-peer-deps
        nohup npx cypress verify > "$RUNNER_TEMP/cypress-verify.log" 2>&1 &

    - name: Build and start the stack
      run: |
        for i in 1 2 3; do
          docker compose --profile replicas up -d --build && exit 0
          echo "docker compose up failed (attempt $i/3)" >&2
          docker compose --profile replicas down -v
          [ "$i" = 3 ] && exit 1
          sleep 15
        done

    - name: Wait for the backend to become healthy
      run: |
        for i in $(seq 1 60); do
          if curl -fs http://localhost:8081/actuator/health/readiness | grep -q '"status":"UP"'; then
            echo "backend is up"
            exit 0
          fi
          sleep 5
        done
        echo "backend never became healthy" >&2
        docker compose logs app
        exit 1

    - name: Wait for the second replica, and confirm it is a second one
      run: |
        for i in $(seq 1 60); do
          if curl -fs http://localhost:8082/actuator/health/readiness | grep -q '"status":"UP"'; then
            break
          fi
          sleep 5
        done
        curl -fsS http://localhost:8082/actuator/health/readiness | grep -q '"status":"UP"' || {
          echo "the second replica never became healthy" >&2
          docker compose logs app2
          exit 1
        }
        first=$(docker compose ps -q app)
        second=$(docker compose ps -q app2)
        test -n "$first" && test -n "$second" && test "$first" != "$second" || {
          echo "app and app2 are not two distinct containers" >&2
          exit 1
        }

    - name: Check that the edge is serving the bundle and proxying the API
      run: |
        for i in $(seq 1 30); do
          if curl -fs http://localhost:8080/healthz >/dev/null; then break; fi
          sleep 2
        done
        set -e
        curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
        curl -fsS -o /dev/null http://localhost:8080/board
        curl -fsS http://localhost:8080/v3/api-docs | grep -q '"openapi"'
        curl -fsSI http://localhost:8080/ | grep -qi '^content-security-policy:'
        test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health)" = "404"
        case "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/columns)" in
          401|403) ;;
          *) echo "/api is not reaching the API container" >&2; exit 1 ;;
        esac

    - name: Seed the Cypress test account
      working-directory: frontend
      env:
        SEED_API_BASE_URL: http://localhost:8080/api
        SEED_PGHOST: localhost
        SEED_PGPORT: 5432
        SEED_PGDATABASE: ${{ env.POSTGRES_DB }}
        SEED_PGUSER: ${{ env.POSTGRES_USER }}
        SEED_PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
      run: npm run cypress:seed

    - name: Run this shard's Cypress specs
      working-directory: frontend
      env:
        CYPRESS_BASE_URL: http://localhost:8080
        SHARD: ${{ matrix.shard }}
        SHARDS: ${{ strategy.job-total }}
      run: |
        specs=$(node cypress/shard.js "$SHARD" "$SHARDS")
        echo "shard $SHARD of $SHARDS: $specs"
        npm run cypress:run -- --spec "$specs"

    - name: Run the cross-replica board-sync spec
      if: matrix.shard == 1
      working-directory: frontend
      env:
        CYPRESS_BASE_URL: http://localhost:8080
      run: npm run cypress:run:replicas

    - name: Check what the Application Insights agent exported
      run: node observability/appinsights-sink/assert-exported.mjs http://127.0.0.1:8099 2

    - name: Upload Cypress artifacts
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: cypress-artifacts-shard-${{ matrix.shard }}
        path: |
          frontend/cypress/screenshots
          frontend/cypress/videos
        if-no-files-found: ignore

    - name: Show the stack's logs
      if: failure()
      run: docker compose --profile replicas logs --no-color --timestamps app app2 web

  image-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kanbanproject-app
            context: backend
            dockerfile: backend/Dockerfile
          - image: kanbanproject-web
            context: frontend
            dockerfile: frontend/Dockerfile

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

    - name: Date the base upgrade
      id: date
      run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"

    # The same build-args kanban-cd.yml passes. This gate is only worth anything if it
    # scans the image the merge will build.
    - name: Build image (not pushed)
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.dockerfile }}
        push: false
        load: true
        build-args: |
          VITE_RECAPTCHA_SITE_KEY=${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          APK_UPGRADE_DATE=${{ steps.date.outputs.today }}
        tags: ${{ matrix.image }}:pr-${{ github.sha }}

    - name: Scan image for vulnerabilities
      id: scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ matrix.image }}:pr-${{ github.sha }}
        format: sarif
        output: trivy-results.sarif
        severity: CRITICAL,HIGH
        limit-severities-for-sarif: true
        ignore-unfixed: true
        exit-code: '1'

    - name: Upload scan results to the Security tab
      if: always() && hashFiles('trivy-results.sarif') != ''
      uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      with:
        sarif_file: trivy-results.sarif
        category: trivy-image-${{ matrix.image }}

  trunk-alarm:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [ backend, frontend, e2e, image-scan ]
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/sweep-alarm.yml
    with:
      results: "${{ needs.backend.result }} ${{ needs.frontend.result }} ${{ needs.e2e.result }} ${{ needs.image-scan.result }}"
      subject: the trunk sweep failed
      label: trunk-red
