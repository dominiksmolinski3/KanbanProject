name: Kanban CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'kanban_ci' }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'kanban_ci' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'kanban_ci' }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'Y2ktb25seS1zaWduaW5nLWtleS1ub3QtYS1yZWFsLXNlY3JldA==' }}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'kanban_ci' }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'kanban_ci' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'kanban_ci' }}
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK 25
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Set executable permissions for mvnw
      run: chmod +x backend/mvnw

    - name: Create .env file
      working-directory: backend
      run: |
        cat > .env <<EOF
        SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
        SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
        SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
        JWT_SECRET_KEY=${JWT_SECRET_KEY}
        EOF

    - name: Build and test backend
      working-directory: backend
      run: ./mvnw --batch-mode clean verify

    - name: Upload test coverage
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-coverage
        path: backend/target/site/jacoco
        if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 26
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: frontend
      run: npm ci --legacy-peer-deps

    - name: Build frontend
      working-directory: frontend
      run: npm run build

    - name: Run linting
      working-directory: frontend
      run: npm run lint

    - name: Run tests with coverage
      working-directory: frontend
      run: npm run test:coverage

    - name: Upload test coverage
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: frontend-test-coverage
        path: frontend/coverage
