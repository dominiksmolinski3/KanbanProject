name: Gradle wrapper

on:
  # Scorecard accepts the committed wrapper jar only when this passed on main's latest commit, so no path filter on push.
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/android/gradle/wrapper/**'
      - '.github/workflows/gradle-wrapper.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the wrapper jar against Gradle's published checksums
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
