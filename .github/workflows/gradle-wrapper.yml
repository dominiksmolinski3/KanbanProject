name: Gradle wrapper

on:
  # Scorecard accepts the committed wrapper jar only when this passed on main's latest commit, so no path filter on push.
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/android/gradle/wrapper/**'
      - '.github/workflows/gradle-wrapper.yml'
  # Android CI calls this before it runs the wrapper. Scorecard reads only the first workflow that names
  # wrapper-validation, so this file must stay the only one.
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the wrapper jar against Gradle's published checksums
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
