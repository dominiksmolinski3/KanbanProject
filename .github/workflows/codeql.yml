name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '24 17 * * 3'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Repair the Maven wrapper
        if: matrix.language == 'java-kotlin'
        run: |
          chmod +x backend/mvnw
          sed -i 's/\r$//' backend/mvnw

      - name: Cache the Maven distribution
        if: matrix.language == 'java-kotlin'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}

      - name: Download Maven
        if: matrix.language == 'java-kotlin'
        working-directory: backend
        run: |
          for attempt in 1 2 3; do
            if ./mvnw --version; then exit 0; fi
            echo "::warning::Maven download failed (attempt $attempt of 3)"
            export MVNW_VERBOSE=true
            [ "$attempt" = 3 ] || sleep $((attempt * 10))
          done
          echo "::error::could not download Maven after 3 attempts"
          exit 1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build backend (Maven)
        if: matrix.language == 'java-kotlin' && matrix.build-mode == 'manual'
        working-directory: backend
        run: ./mvnw -q -DskipTests -Dmaven.test.skip=true package

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{matrix.language}}"
