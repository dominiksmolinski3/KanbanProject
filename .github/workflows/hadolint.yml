name: Hadolint

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - 'observability/grafana/Dockerfile'
      - '.github/workflows/hadolint.yml'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/pr-changes.yml
    with:
      paths: '^((backend|frontend|observability/grafana)/Dockerfile|\.github/workflows/(hadolint|pr-changes)\.yml)$'

  hadolint:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - backend/Dockerfile
          - frontend/Dockerfile
          - observability/grafana/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint ${{ matrix.dockerfile }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  hadolint-gate:
    if: always()
    needs: [ changes, hadolint ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Every job passed, or had nothing to check
      env:
        CHANGES: ${{ needs.changes.result }}
        RESULTS: ${{ needs.hadolint.result }}
      run: |
        [ "$CHANGES" = success ] || { echo "::error::deciding what changed ended $CHANGES"; exit 1; }
        for result in $RESULTS; do
          case "$result" in success|skipped) ;; *) echo "::error::a job ended $result"; exit 1 ;; esac
        done
