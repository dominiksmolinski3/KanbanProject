name: Infrastructure CI

on:
  push:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - 'observability/grafana/Dockerfile'
      - '.github/workflows/**'
      - '.checkov.yaml'
      - '.checkov/**'
      - 'ansible/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/pr-changes.yml
    with:
      paths: '^(terraform/|ansible/|\.checkov/|\.checkov\.yaml$|\.github/workflows/|(backend|frontend|observability/grafana)/Dockerfile$)'

  validate:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: terraform

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: 1.12.2
        terraform_wrapper: false

    - name: Check formatting
      run: terraform fmt -check -recursive -diff

    - name: Initialize without backend
      run: terraform init -backend=false -input=false -no-color

    - name: Validate configuration
      run: terraform validate -no-color

    - name: Validate the bootstrap root
      working-directory: terraform/bootstrap
      run: |
        terraform init -backend=false -input=false -no-color
        terraform validate -no-color

    - name: Set up TFLint
      uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      with:
        tflint_version: v0.64.0

    - name: Lint with TFLint and the azurerm ruleset
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        tflint --init --config "$PWD/.tflint.hcl"
        tflint --recursive --config "$PWD/.tflint.hcl" --format compact

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'

    # Checkov covers terraform/, both Dockerfiles and the workflows; its scope is
    # .checkov.yaml, so the push paths and the changes regex have to stay as wide as that file.
    - name: Scan with Checkov
      working-directory: .
      run: |
        pip install -r .checkov/requirements.txt
        checkov --config-file .checkov.yaml

  infrastructure-gate:
    if: always()
    needs: [ changes, validate ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Every job passed, or had nothing to check
      env:
        CHANGES: ${{ needs.changes.result }}
        RESULTS: ${{ needs.validate.result }}
      run: |
        [ "$CHANGES" = success ] || { echo "::error::deciding what changed ended $CHANGES"; exit 1; }
        for result in $RESULTS; do
          case "$result" in success|skipped) ;; *) echo "::error::a job ended $result"; exit 1 ;; esac
        done
