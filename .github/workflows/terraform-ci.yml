name: Terraform CI

on:
  push:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: 1.12.2
        terraform_wrapper: false

    - name: Check formatting
      run: terraform fmt -check -recursive -diff

    - name: Initialize without backend
      run: terraform init -backend=false -input=false -no-color

    - name: Validate configuration
      run: terraform validate -no-color

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'

    - name: Scan with Checkov
      working-directory: .
      run: |
        pip install checkov==3.3.16
        checkov --config-file .checkov.yaml

  plan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && vars.TF_PLAN_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: terraform
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: 1.12.2
        terraform_wrapper: false

    - name: Azure login (OIDC)
      uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Terraform init (dev state)
      env:
        ARM_USE_OIDC: "true"
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      run: terraform init -reconfigure -input=false -no-color -backend-config="key=env/dev/terraform.tfstate"

    - name: Terraform plan (dev, no refresh)
      id: plan
      env:
        ARM_USE_OIDC: "true"
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      run: |
        set -o pipefail
        terraform plan -input=false -no-color -lock=false -refresh=false \
          -var-file=dev.tfvars | tee plan.txt
        {
          echo '### Terraform plan — dev (no refresh)'
          echo '```'
          tail -c 60000 plan.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
