name: Stale exceptions

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/stale-exceptions.yml'
      - '.github/scripts/stale_exceptions.mjs'
  schedule:
    - cron: '17 7 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH: ops/stale-exceptions
      PR_TOKEN: ${{ secrets.BASE_IMAGES_PR_TOKEN }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26

    - name: Set up JDK 25
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Scan the published Grafana image without its ignore file
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ghcr.io/${{ github.repository_owner }}/kanbanproject-grafana:latest
        format: json
        output: grafana-trivy.json
        severity: CRITICAL,HIGH
        ignore-unfixed: true

    - name: Remove the exceptions nothing needs any more
      id: sweep
      run: |
        set -euo pipefail
        node .github/scripts/stale_exceptions.mjs \
          --trivy observability/grafana/.trivyignore.yaml=grafana-trivy.json \
          --summary body.md --apply
        git diff
        echo "changed=$([ -s body.md ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    - name: Push the branch and open or update the pull request
      if: steps.sweep.outputs.changed == 'true' && github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ secrets.BASE_IMAGES_PR_TOKEN || secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        OWNER: ${{ github.repository_owner }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git switch -C "$BRANCH"
        git add -u
        printf 'build(deps): drop the exceptions nothing needs any more\n\n%s\n' "$(cat body.md)" | git commit -q -F -
        git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$GH_REPO.git"
        git push --force origin "$BRANCH"

        if [ -z "$PR_TOKEN" ]; then
          echo "::error::the BASE_IMAGES_PR_TOKEN secret is not set, so the change is pushed to $BRANCH but no pull request is open. A pull request opened with GITHUB_TOKEN runs no CI; open it from https://github.com/$GH_REPO/compare/main...$BRANCH"
          exit 1
        fi

        {
          echo 'These exceptions no longer catch anything:'
          echo
          cat body.md
          echo
          echo "Found by $RUN_URL."
        } > pr-body.md
        pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
        if [ -n "$pr" ]; then
          gh pr edit "$pr" --body-file pr-body.md
        else
          gh pr create --base main --head "$BRANCH" \
            --title 'build(deps): drop the exceptions nothing needs any more' --body-file pr-body.md \
            --assignee "$OWNER" --label techdebt --label dependencies
        fi

  stale-exceptions-alarm:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [ sweep ]
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/sweep-alarm.yml
    with:
      results: "${{ needs.sweep.result }}"
      subject: the stale exception sweep failed
      label: sweep-red
