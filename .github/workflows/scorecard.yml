name: OpenSSF Scorecard

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '11 7 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Scorecard flags the Gradle wrapper jar unless gradle-wrapper.yml has already succeeded on this commit.
  wrapper-validated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
    - name: Wait for the Gradle wrapper run on this commit to finish
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        for _ in $(seq 18); do
          run_id=$(gh run list --workflow gradle-wrapper.yml --commit "$SHA" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          [ -n "$run_id" ] && break
          sleep 10
        done
        if [ -z "$run_id" ]; then
          echo "::error::no Gradle wrapper run for $SHA"
          exit 1
        fi
        gh run watch "$run_id" --interval 5 > /dev/null
        gh run view "$run_id" --json conclusion --jq '"Gradle wrapper run \(.conclusion)"'

  analysis:
    needs: [ wrapper-validated ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Score the repository's supply-chain practices
      uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
      with:
        results_file: scorecard.sarif
        results_format: sarif
        publish_results: true

    - name: Upload the results to the Security tab
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: scorecard.sarif
        category: scorecard

  scorecard-alarm:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [ analysis ]
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/sweep-alarm.yml
    with:
      results: "${{ needs.analysis.result }}"
      subject: the Scorecard sweep failed
      label: scan-red
