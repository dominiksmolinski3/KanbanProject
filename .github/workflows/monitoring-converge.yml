name: Monitoring VM converge

on:
  push:
    branches: [ main ]
    paths:
      - 'ansible/**'
      - 'observability/**'
      - '.github/workflows/monitoring-converge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitoring-drift
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: terraform-drift
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the environment's variables
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          for name in CLIENT_ID TENANT_ID SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::The terraform-drift environment is missing $name. A converge that ran nothing must not report that it passed."
              exit 1
            fi
          done

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Converge the VM to this commit
        run: bash ansible/scripts/converge.sh "$GITHUB_SHA"

      - name: Check that a second converge changes nothing
        run: bash ansible/scripts/converge.sh "$GITHUB_SHA" --check
