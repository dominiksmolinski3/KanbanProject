name: Base images

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'images/**'
      - '.github/workflows/base-images.yml'
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rebuild:
    name: rebuild (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kanbanproject-curl
            context: images/curl
            upstream: curlimages/curl
          - image: kanbanproject-postgres
            context: images/postgres
            upstream: postgres
            skip-files: usr/local/bin/gosu
          - image: kanbanproject-rabbitmq
            context: images/rabbitmq
            upstream: rabbitmq

    env:
      IMAGE: ${{ matrix.image }}
      CONTEXT: ${{ matrix.context }}
      UPSTREAM: ${{ matrix.upstream }}
      REPOSITORY: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Pull Docker Hub images through a mirror
      id: mirror
      uses: ./.github/actions/docker-hub-mirror

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      with:
        buildkitd-config-inline: ${{ steps.mirror.outputs.buildkitd-config }}

    - name: Find the base and the image Terraform pins
      id: refs
      run: |
        set -euo pipefail
        base=$(sed -n 's/^FROM[[:space:]]\{1,\}//p' "$CONTEXT/Dockerfile")
        if [ "$(wc -l <<<"$base")" != 1 ] || [ -z "$base" ]; then
          echo "::error::$CONTEXT/Dockerfile must have exactly one FROM line"
          exit 1
        fi
        pins=$(git grep -hoE "image[[:space:]]*=[[:space:]]*\"(${UPSTREAM}|${REPOSITORY//./\\.}):[^\"]+\"" -- 'terraform/*.tf' \
          | sed -E 's/^image[[:space:]]*=[[:space:]]*"(.*)"$/\1/' | sort -u)
        if [ "$(wc -l <<<"$pins")" != 1 ] || [ -z "$pins" ]; then
          echo "::error::Terraform must pin exactly one $UPSTREAM or $REPOSITORY reference, found: ${pins:-none}"
          exit 1
        fi
        upstream_tag=${base%%@*}
        upstream_tag=${upstream_tag##*:}
        {
          echo "base=$base"
          echo "pinned=$pins"
          echo "tag=$REPOSITORY:$upstream_tag-$(date -u +%Y%m%d)"
          echo "today=$(date -u +%F)"
        } >> "$GITHUB_OUTPUT"
        echo "Dockerfile builds on $base; Terraform pins $pins"

    - name: Build the candidate (not pushed)
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ matrix.context }}
        push: false
        load: true
        build-args: APK_UPGRADE_DATE=${{ steps.refs.outputs.today }}
        tags: ${{ matrix.image }}:candidate
        labels: |
          org.opencontainers.image.base.name=${{ steps.refs.outputs.base }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}

    - name: Pull the pinned image
      env:
        PINNED: ${{ steps.refs.outputs.pinned }}
      run: docker pull -q "$PINNED"

    - name: Scan the candidate
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ matrix.image }}:candidate
        format: json
        output: candidate.json
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        skip-files: ${{ matrix.skip-files }}

    - name: Scan the pinned image
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ steps.refs.outputs.pinned }}
        format: json
        output: pinned.json
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        skip-files: ${{ matrix.skip-files }}
        skip-setup-trivy: true

    - name: Decide whether the candidate replaces the pinned image
      id: decide
      env:
        BASE: ${{ steps.refs.outputs.base }}
        PINNED: ${{ steps.refs.outputs.pinned }}
      run: |
        set -euo pipefail
        export LC_ALL=C
        findings() { jq -r '[.Results[]?.Vulnerabilities[]? | "\(.VulnerabilityID) \(.PkgName)"] | unique[]' "$1"; }
        findings candidate.json > candidate.txt
        findings pinned.json > pinned.txt
        resolved=$(comm -23 pinned.txt candidate.txt)
        introduced=$(comm -13 pinned.txt candidate.txt)
        pinned_base=$(docker image inspect "$PINNED" --format '{{ index .Config.Labels "org.opencontainers.image.base.name" }}')

        echo "Pinned: $(wc -l < pinned.txt) findings, candidate: $(wc -l < candidate.txt)"
        if [ -n "$introduced" ]; then
          echo "::error::the rebuild of $IMAGE has findings the pinned image does not:"
          echo "$introduced"
          exit 1
        fi

        reasons=()
        if [ -z "$pinned_base" ]; then
          reasons+=("replaces the upstream pin")
        elif [ "$pinned_base" != "$BASE" ]; then
          reasons+=("builds on $BASE (was $pinned_base)")
        fi
        if [ -n "$resolved" ]; then
          reasons+=("resolves $(cut -d' ' -f1 <<<"$resolved" | sort -u | paste -sd' ')")
        fi
        if [ ${#reasons[@]} -eq 0 ]; then
          echo "publish=false" >> "$GITHUB_OUTPUT"
          echo "::notice::$IMAGE: the rebuild resolves nothing and the base has not moved; the pin stays"
          exit 0
        fi
        reason=$(printf '%s; ' "${reasons[@]}")
        reason=${reason%; }
        echo "publish=true" >> "$GITHUB_OUTPUT"
        echo "reason=$reason" >> "$GITHUB_OUTPUT"
        echo "::notice::$IMAGE $reason"

    - name: Log in to GHCR
      if: steps.decide.outputs.publish == 'true' && github.event_name != 'pull_request'
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # The same inputs as the candidate build, so the builder's cache hands back the scanned layers.
    - name: Publish the candidate
      id: push
      if: steps.decide.outputs.publish == 'true' && github.event_name != 'pull_request'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ matrix.context }}
        push: true
        build-args: APK_UPGRADE_DATE=${{ steps.refs.outputs.today }}
        tags: ${{ steps.refs.outputs.tag }}
        labels: |
          org.opencontainers.image.base.name=${{ steps.refs.outputs.base }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.licenses=MIT

    - name: Install cosign
      if: steps.push.outcome == 'success'
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

    - name: Sign the image (keyless)
      if: steps.push.outcome == 'success'
      env:
        DIGEST: ${{ steps.push.outputs.digest }}
      run: cosign sign --yes "$REPOSITORY@$DIGEST"

    - name: Check that the image pulls without credentials
      if: steps.push.outcome == 'success'
      env:
        DIGEST: ${{ steps.push.outputs.digest }}
      run: |
        set -euo pipefail
        path=${REPOSITORY#ghcr.io/}
        token=$(curl -fsS "https://ghcr.io/token?scope=repository:$path:pull" | jq -r '.token // empty')
        if ! curl -fsS -o /dev/null -H "Authorization: Bearer $token" \
          -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
          "https://ghcr.io/v2/$path/manifests/$DIGEST"; then
          echo "::error::$REPOSITORY is not public, and the Azure jobs pull it without credentials. Set it to public under the package's settings and run this workflow again."
          exit 1
        fi

    - name: Record the new pin
      if: steps.push.outcome == 'success'
      env:
        PINNED: ${{ steps.refs.outputs.pinned }}
        TAG: ${{ steps.refs.outputs.tag }}
        DIGEST: ${{ steps.push.outputs.digest }}
        REASON: ${{ steps.decide.outputs.reason }}
      run: |
        jq -n --arg image "$IMAGE" --arg from "$PINNED" --arg to "$TAG@$DIGEST" --arg reason "$REASON" \
          '{image: $image, from: $from, to: $to, reason: $reason}' > pin.json

    - name: Upload the new pin
      if: steps.push.outcome == 'success'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: pin-${{ matrix.image }}
        path: pin.json
        if-no-files-found: error
        retention-days: 7

  pin-pr:
    needs: rebuild
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      BRANCH: ops/base-image-pins
      PR_TOKEN: ${{ secrets.BASE_IMAGES_PR_TOKEN }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download the new pins
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: pin-*
        path: pins
        merge-multiple: false

    - name: Move the Terraform pins
      id: move
      run: |
        set -euo pipefail
        shopt -s nullglob
        files=(pins/*/pin.json)
        if [ ${#files[@]} -eq 0 ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "::notice::no image was published, so no pin moves"
          exit 0
        fi
        : > body.md
        for pin in "${files[@]}"; do
          from=$(jq -r .from "$pin"); to=$(jq -r .to "$pin")
          git grep -lF "\"$from\"" -- 'terraform/*.tf' | while read -r file; do
            FROM="$from" TO="$to" perl -pi -e 's/\Q"$ENV{FROM}"\E/"$ENV{TO}"/g' "$file"
          done
          jq -r '"- `\(.image)` \(.reason)\n  - from `\(.from)`\n  - to `\(.to)`"' "$pin" >> body.md
        done
        git diff --stat
        echo "changed=$([ -n "$(git status --porcelain terraform)" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    - name: Push the branch and open or update the pull request
      if: steps.move.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ secrets.BASE_IMAGES_PR_TOKEN || secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        OWNER: ${{ github.repository_owner }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git switch -C "$BRANCH"
        printf 'ops(terraform): pin the rebuilt base images\n\n%s\n' "$(cat body.md)" | git commit -qa -F -
        # A push made with GITHUB_TOKEN starts no workflow, so the pull request's checks need the PAT.
        git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$GH_REPO.git"
        git push --force origin "$BRANCH"

        if [ -z "$PR_TOKEN" ]; then
          echo "::error::the BASE_IMAGES_PR_TOKEN secret is not set, so the pins are pushed to $BRANCH but no pull request is open. A pull request opened with GITHUB_TOKEN runs no CI; open it from https://github.com/$GH_REPO/compare/main...$BRANCH"
          exit 1
        fi

        {
          echo 'Rebuilt base images that replace what Terraform pins:'
          echo
          cat body.md
          echo
          echo "Opened by $RUN_URL."
        } > pr-body.md
        number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
        if [ -n "$number" ]; then
          gh pr edit "$number" --body-file pr-body.md
        else
          gh pr create --base main --head "$BRANCH" \
            --title 'ops(terraform): pin the rebuilt base images' --body-file pr-body.md \
            --assignee "$OWNER" --label dependencies --label terraform --label docker
        fi

  base-images-alarm:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [ rebuild, pin-pr ]
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/sweep-alarm.yml
    with:
      results: "${{ needs.rebuild.result }} ${{ needs.pin-pr.result }}"
      subject: the base image rebuild failed
      label: scan-red
