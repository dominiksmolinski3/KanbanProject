name: DHI package pins refresh

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/dhi-pins-refresh.yml'
      - '.github/scripts/dhi_pins_refresh.py'
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: ops/dhi-package-pins
      PR_TOKEN: ${{ secrets.BASE_IMAGES_PR_TOKEN }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Move each pin to what dhi.io's index lists now
      id: describe
      run: |
        set -euo pipefail
        python3 .github/scripts/dhi_pins_refresh.py ansible/group_vars/all.yml body.md
        git diff --stat
        echo "changed=$([ -s body.md ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    - name: Push the branch and open or update the pull request
      if: steps.describe.outputs.changed == 'true' && github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ secrets.BASE_IMAGES_PR_TOKEN || secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        OWNER: ${{ github.repository_owner }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git switch -C "$BRANCH"
        git add ansible/group_vars/all.yml
        git commit -q -m 'ops(monitoring): re-pin the DHI packages to dhi.io'"'"'s index'
        git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$GH_REPO.git"
        git push --force origin "$BRANCH"

        if [ -z "$PR_TOKEN" ]; then
          echo "::error::the BASE_IMAGES_PR_TOKEN secret is not set, so the pins are pushed to $BRANCH but no pull request is open. A pull request opened with GITHUB_TOKEN runs no CI; open it from https://github.com/$GH_REPO/compare/main...$BRANCH"
          exit 1
        fi

        { cat body.md; echo; echo "Opened by $RUN_URL."; } > pr-body.md
        pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
        if [ -n "$pr" ]; then
          gh pr edit "$pr" --body-file pr-body.md
        else
          pr=$(gh pr create --base main --head "$BRANCH" \
            --title 'ops(monitoring): re-pin the DHI packages to dhi.io'"'"'s index' --body-file pr-body.md \
            --assignee "$OWNER" --label techdebt --label dependencies)
        fi
        gh pr merge --auto --squash "$pr"

  dhi-pins-alarm:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [ refresh ]
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/sweep-alarm.yml
    with:
      results: "${{ needs.refresh.result }}"
      subject: the DHI package pins refresh failed
      label: sweep-red
