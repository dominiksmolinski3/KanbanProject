name: Release images

on:
  push:
    tags: [ 'v*' ]

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Check that the tag is a release of a commit on main
      env:
        TAG: ${{ github.ref_name }}
      run: |
        if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "::error::$TAG is not vX.Y.Z; pre-release suffixes are not released"
          exit 1
        fi
        version="${TAG#v}"
        pom=$(sed -n '/<artifactId>KanbanProject2<\/artifactId>/{n;s/.*<version>\(.*\)<\/version>.*/\1/p;q}' backend/pom.xml)
        package=$(node -p "require('./frontend/package.json').version")
        lock=$(node -p "require('./frontend/package-lock.json').version")
        if [ "$pom" != "$version" ] || [ "$package" != "$version" ] || [ "$lock" != "$version" ]; then
          echo "::error::$TAG was pushed on a commit whose versions are backend/pom.xml=$pom, frontend/package.json=$package, package-lock.json=$lock"
          exit 1
        fi
        if ! git merge-base --is-ancestor HEAD origin/main; then
          echo "::error::$TAG points at a commit that is not on main"
          exit 1
        fi

    - name: Check that Kanban CI passed on this commit
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        commit=$(git rev-parse HEAD)
        passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow kanban-ci.yml --commit "$commit" \
          --status success --json databaseId --jq length)
        if [ "$passed" -eq 0 ]; then
          echo "::error::Kanban CI has no successful run on $commit; a release is cut only from a commit main has tested"
          exit 1
        fi

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Log in to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Give the images of this commit the version
      env:
        TAG: ${{ github.ref_name }}
      run: |
        version="${TAG#v}"
        commit=$(git rev-parse HEAD)
        owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
        images="kanbanproject-app kanbanproject-web kanbanproject-grafana"

        # Every image is checked before any is tagged, so a release is all three or none.
        for image in $images; do
          source="ghcr.io/$owner/$image:$commit"
          if ! built=$(docker buildx imagetools inspect "$source" --format '{{.Manifest.Digest}}'); then
            echo "::error::$source does not exist; Kanban CD has not pushed this commit yet, or failed. Re-run this job once it has."
            exit 1
          fi
          # CD signs an image only after its Trivy scan passes, so a missing signature is a failed scan.
          if ! cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/kanban-cd.yml@refs/heads/main" \
              "ghcr.io/$owner/$image@$built" > /dev/null; then
            echo "::error::ghcr.io/$owner/$image@$built carries no signature from Kanban CD on main"
            exit 1
          fi
          if existing=$(docker buildx imagetools inspect "ghcr.io/$owner/$image:$version" --format '{{.Manifest.Digest}}' 2>/dev/null) \
              && [ "$existing" != "$built" ]; then
            echo "::error::$image:$version already exists and is a different image ($existing, not $built); a released version is never moved"
            exit 1
          fi
        done

        for image in $images; do
          docker buildx imagetools create \
            --tag "ghcr.io/$owner/$image:$version" \
            "ghcr.io/$owner/$image:$commit"
          echo "$image:$version -> $(docker buildx imagetools inspect "ghcr.io/$owner/$image:$version" --format '{{.Manifest.Digest}}')"
        done
