name: Pull request changes

on:
  workflow_call:
    inputs:
      paths:
        description: 'Extended regex; the caller has work to do when a changed path matches it'
        required: true
        type: string
    outputs:
      relevant:
        description: "'true' on any event but a pull request, and on a pull request that changes a matching path"
        value: ${{ jobs.diff.outputs.relevant }}

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
    - name: Match the pull request's files against the caller's paths
      id: diff
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT: ${{ github.event_name }}
        PR: ${{ github.event.pull_request.number }}
        PATHS: ${{ inputs.paths }}
      run: |
        set -euo pipefail
        if [ "$EVENT" != pull_request ]; then
          echo "relevant=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
          --jq '.[] | .filename, (.previous_filename // empty)')
        if grep -qE "$PATHS" <<<"$files"; then relevant=true; else relevant=false; fi
        echo "relevant=$relevant" | tee -a "$GITHUB_OUTPUT"
