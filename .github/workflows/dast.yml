name: DAST (OWASP ZAP)

# Everything else here is static (CodeQL, Trivy, Checkov) — this is the one workflow
# that exercises the running app, spidering and passively scanning it the way an
# outside attacker's first pass would, which is the only way to catch things like a
# response missing security headers or a route that leaks more than it should.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same shape as .env.example's local-dev defaults: captcha off (no site key
      # baked into this build), mail unset (drops to DisabledEmailSender), storage
      # unset (falls through to the compose file's own azurite default) - enough for
      # the app to boot and serve real pages without needing any real secret.
      - name: Create .env file
        run: |
          cat > .env <<EOF
          SPRING_DATASOURCE_DB=kanban_dast
          SPRING_DATASOURCE_USERNAME=kanban_dast
          SPRING_DATASOURCE_PASSWORD=kanban_dast
          JWT_SECRET_KEY=Y2ktb25seS1zaWduaW5nLWtleS1ub3QtYS1yZWFsLXNlY3JldA==
          ACS_EMAIL_CONNECTION_STRING=
          ACS_EMAIL_SENDER_ADDRESS=
          CAPTCHA_ENABLED=false
          CAPTCHA_SECRET=
          VITE_RECAPTCHA_SITE_KEY=
          EOF

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the app to become healthy
        run: |
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health/readiness || true)
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::app did not become ready in time"
          docker compose logs app
          exit 1

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://localhost:8080'
          # Passive baseline only (no active/attack payloads) against a throwaway
          # local stack seeded with no real data - safe to run unattended. Findings
          # land in a standing "ZAP Scan Baseline Report" issue that gets updated in
          # place each run, and in the run's own artifact either way.
          fail_action: false

      # The findings themselves land in a standing issue that the action rewrites in place. That
      # issue is the whole output of this sweep and it had no assignee, so it notified nobody:
      # #96 sat open and unread for eight days, and its first finding was that the application
      # sent no Content-Security-Policy at all. An issue nobody is subscribed to is the same
      # shape as the dead-letter queue MAIL-04 was filed over, and it cost the same.
      #
      # Best-effort on purpose: the scan has already run and its report is already filed by the
      # time this executes, so a failure here must not turn a green sweep red.
      - name: Make sure somebody is subscribed to the report
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CONTACT: ${{ vars.SECURITY_CONTACT || github.repository_owner }}
        run: |
          set -euo pipefail
          # The action names its issue exactly this; matched on the title because the issue
          # carries no label of its own until this step puts one on it.
          number=$(gh issue list --state open --limit 100 --json number,title             | jq -r 'map(select(.title == "ZAP Scan Baseline Report")) | .[0].number // empty')
          if [ -z "$number" ]; then
            echo "::notice::no open ZAP report issue - the scan found nothing worth filing"
            exit 0
          fi
          gh label create dast --color 5319E7 --description "Filed by the scheduled ZAP sweep" --force >/dev/null
          gh issue edit "$number" --add-label dast --add-assignee "$CONTACT"

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # `fail_action: false` above means this job is green whatever ZAP finds, so this alarm only ever
  # catches the sweep itself breaking - the stack refusing to boot, the action failing. The
  # findings reach a person through the standing issue instead, which is why the step above
  # assigns it. Both halves are needed: one of them answers "the scan found something", the other
  # answers "the scan did not run".
  scan-alarm:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [ zap-baseline ]
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/sweep-alarm.yml
    with:
      results: "${{ needs.zap-baseline.result }}"
      subject: the DAST sweep failed
      label: scan-red
