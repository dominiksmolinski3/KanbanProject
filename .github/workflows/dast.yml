name: DAST (OWASP ZAP)

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      issues: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Log in to Docker Hardened Images
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: dhi.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull Docker Hub images through a mirror
        uses: ./.github/actions/docker-hub-mirror

      - name: Create .env file
        run: |
          cat > .env <<EOF
          SPRING_DATASOURCE_DB=kanban_dast
          SPRING_DATASOURCE_USERNAME=kanban_dast
          SPRING_DATASOURCE_PASSWORD=kanban_dast
          JWT_SECRET_KEY=Y2ktb25seS1zaWduaW5nLWtleS1ub3QtYS1yZWFsLXNlY3JldA==
          ACS_EMAIL_CONNECTION_STRING=
          ACS_EMAIL_SENDER_ADDRESS=
          CAPTCHA_ENABLED=false
          CAPTCHA_SECRET=
          VITE_RECAPTCHA_SITE_KEY=
          EOF

      # A scan sends far more than any one client, and rate limit answers hide whatever it was probing.
      - name: Lift the API's rate limits for the scan
        run: |
          cat > docker-compose.override.yml <<'EOF'
          services:
            app:
              environment:
                SECURITY_RATELIMIT_ENABLED: "false"
                SECURITY_APIRATELIMIT_ENABLED: "false"
          EOF

      - name: Start the stack
        run: docker compose up -d --build

      # The API container's own port. :8080 is nginx, which answers /actuator with a
      # deliberate 404, so polling readiness there can never succeed.
      - name: Wait for the app to become healthy
        run: |
          for _ in $(seq 1 60); do
            if curl -fs http://localhost:8081/actuator/health/readiness | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::app did not become ready in time"
          docker compose logs app
          exit 1

      - name: Wait for the edge, which is what gets scanned
        run: |
          for _ in $(seq 1 30); do
            if curl -fs http://localhost:8080/healthz >/dev/null; then
              curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
              exit 0
            fi
            sleep 2
          done
          echo "::error::the edge did not start serving the bundle in time"
          docker compose logs web
          exit 1

      - name: Only the edge answers on an address other than loopback
        run: |
          set -euo pipefail
          host=$(hostname -I | awk '{print $1}')
          docker compose ps --format json \
            | jq -s -r 'flatten | .[] | .Service as $s | (.Publishers // [])[] | select(.PublishedPort > 0) | "\($s) \(.URL) \(.PublishedPort)"' \
            | sort -u > published.txt
          cat published.txt
          grep -q '^web ' published.txt || { echo "::error::no published edge port found, so this checked nothing"; exit 1; }
          bad=0
          while read -r service url port; do
            edge=false
            [ "$service" = web ] && [ "$port" = 8080 ] && edge=true
            if [ "$edge" = false ] && [ "$url" != 127.0.0.1 ] && [ "$url" != ::1 ]; then
              echo "::error::$service publishes $port on $url, not on loopback"
              bad=1
            fi
            if timeout 3 bash -c "exec 3<>/dev/tcp/$host/$port" 2>/dev/null; then open=true; else open=false; fi
            if [ "$open" != "$edge" ]; then
              echo "::error::$service port $port on $host: open=$open, expected $edge"
              bad=1
            fi
          done < published.txt
          exit "$bad"

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-j'
          fail_action: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Seed tokens live 15 minutes, so the account is made right before the scan that uses it.
      - name: Sign in a seeded account for the API scan
        env:
          LOAD_USERS: 2
          LOAD_TASKS: 10
          LOAD_PGHOST: localhost
          LOAD_PGPORT: 5432
          LOAD_PGDATABASE: kanban_dast
          LOAD_PGUSER: kanban_dast
          LOAD_PGPASSWORD: kanban_dast
        run: |
          set -euo pipefail
          npm ci --prefix frontend --no-audit --no-fund
          node loadtest/seed.mjs
          token=$(jq -r '.users[0].token' loadtest/.run/accounts.json)
          test -n "$token" && test "$token" != null
          echo "::add-mask::$token"
          echo "ZAP_AUTH_HEADER_VALUE=Bearer $token" >> "$GITHUB_ENV"
          rm loadtest/.run/accounts.json

      # The baseline has uploaded these already, and the API scan's container user cannot overwrite them.
      - name: Clear the baseline's reports
        run: rm -f report_json.json report_md.md report_html.html

      - name: ZAP API scan, signed in, from the OpenAPI document
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        env:
          ZAP_AUTH_HEADER_SITE: localhost
        with:
          target: 'http://localhost:8080/v3/api-docs'
          format: openapi
          rules_file_name: '.zap/rules.tsv'
          issue_title: 'ZAP API Scan Report'
          artifact_name: 'zap_api_scan'
          fail_action: false

      - name: Make sure somebody is subscribed to the report
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CONTACT: ${{ vars.SECURITY_CONTACT || github.repository_owner }}
        run: |
          set -euo pipefail
          gh label create dast --color 5319E7 --description "Filed by the scheduled ZAP sweep" --force >/dev/null
          for title in "ZAP Scan Baseline Report" "ZAP API Scan Report"; do
            number=$(gh issue list --state open --limit 100 --json number,title \
              | jq -r --arg title "$title" 'map(select(.title == $title)) | .[0].number // empty')
            if [ -z "$number" ]; then
              echo "::notice::no open \"$title\" issue - that scan found nothing worth filing"
              continue
            fi
            gh issue edit "$number" --add-label dast --add-assignee "$CONTACT"
          done

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  scan-alarm:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [ zap-baseline ]
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/sweep-alarm.yml
    with:
      results: "${{ needs.zap-baseline.result }}"
      subject: the DAST sweep failed
      label: scan-red
