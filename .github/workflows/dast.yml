name: DAST (OWASP ZAP)

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create .env file
        run: |
          cat > .env <<EOF
          SPRING_DATASOURCE_DB=kanban_dast
          SPRING_DATASOURCE_USERNAME=kanban_dast
          SPRING_DATASOURCE_PASSWORD=kanban_dast
          JWT_SECRET_KEY=Y2ktb25seS1zaWduaW5nLWtleS1ub3QtYS1yZWFsLXNlY3JldA==
          ACS_EMAIL_CONNECTION_STRING=
          ACS_EMAIL_SENDER_ADDRESS=
          CAPTCHA_ENABLED=false
          CAPTCHA_SECRET=
          VITE_RECAPTCHA_SITE_KEY=
          EOF

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the app to become healthy
        run: |
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health/readiness || true)
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::app did not become ready in time"
          docker compose logs app
          exit 1

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://localhost:8080'
          fail_action: false

      - name: Make sure somebody is subscribed to the report
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CONTACT: ${{ vars.SECURITY_CONTACT || github.repository_owner }}
        run: |
          set -euo pipefail
          number=$(gh issue list --state open --limit 100 --json number,title             | jq -r 'map(select(.title == "ZAP Scan Baseline Report")) | .[0].number // empty')
          if [ -z "$number" ]; then
            echo "::notice::no open ZAP report issue - the scan found nothing worth filing"
            exit 0
          fi
          gh label create dast --color 5319E7 --description "Filed by the scheduled ZAP sweep" --force >/dev/null
          gh issue edit "$number" --add-label dast --add-assignee "$CONTACT"

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  scan-alarm:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [ zap-baseline ]
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/sweep-alarm.yml
    with:
      results: "${{ needs.zap-baseline.result }}"
      subject: the DAST sweep failed
      label: scan-red
