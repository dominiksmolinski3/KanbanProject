name: Android CI

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/android/**'
      - 'frontend/capacitor.config.ts'
      - 'frontend/vite.config.js'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/android/**'
      - 'frontend/capacitor.config.ts'
      - 'frontend/vite.config.js'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The mobile build refuses to run without an API origin; this one only has to be recognisable in the bundle.
      VITE_API_ORIGIN: https://kanban.invalid
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check the committed Gradle wrapper is a released one
      uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Set up JDK 21
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Install dependencies
      working-directory: frontend
      run: npm ci

    - name: Build the web app for the device and copy it into the Android project
      working-directory: frontend
      run: npm run cap:sync

    - name: Build the debug APK
      working-directory: frontend/android
      run: ./gradlew --no-daemon --console=plain assembleDebug

    - name: Check the APK carries the web build and the API origin
      working-directory: frontend/android/app/build/outputs/apk/debug
      run: |
        unzip -l app-debug.apk | grep -q 'assets/public/index.html'
        unzip -p app-debug.apk 'assets/public/assets/*.js' | grep -q 'kanban.invalid'
